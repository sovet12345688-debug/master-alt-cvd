name: BTC TREND V3.0 Phase3 Trend State Validation

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/run_phase3_trend_state.py'
      - '.github/workflows/btc_trend_v30_phase3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run Phase3 trend-state research
        run: python btc_trend_v30/run_phase3_trend_state.py
      - name: Show compact verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='btc_trend_v30/output/phase3_v01/summary.json'
          d=json.load(open(p,encoding='utf-8'))
          print('ENGINE=',d['engine'])
          print('LONG=',d['LONG'])
          print('SHORT=',d['SHORT'])
          print('OVERALL=',d['overall_stage'])
          PY
      - name: Upload Phase3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-phase3-v01
          path: btc_trend_v30/output/phase3_v01/
          retention-days: 14
