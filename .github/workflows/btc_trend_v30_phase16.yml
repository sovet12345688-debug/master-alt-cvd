name: BTC TREND V3.0 Phase1.6 Zone Utility Validation

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/run_phase16.py'
      - '.github/workflows/btc_trend_v30_phase16.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-phase16:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run Phase1.6
        run: python btc_trend_v30/run_phase16.py
      - name: Show compact verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='btc_trend_v30/output/phase16/summary.json'
          d=json.load(open(p,encoding='utf-8'))
          print('ENGINE=',d['engine'])
          print('LONG=',d['LONG']['utility'])
          print('SHORT=',d['SHORT']['utility'])
          print('COARSE=',d['coarse_zone_utility_pass'])
          print('FULL100=',d['full_0_100_calibration_pass'])
          print('OVERALL=',d['overall_stage'])
          PY
      - name: Upload Phase1.6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-phase16
          path: btc_trend_v30/output/phase16/
          retention-days: 14
