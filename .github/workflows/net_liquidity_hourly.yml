name: MASTER US Net Liquidity Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    paths:
      - 'net_liquidity/**'
      - '.github/workflows/net_liquidity_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-net-liquidity-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: net_liquidity/requirements.txt

      - name: Install dependencies
        run: pip install -r net_liquidity/requirements.txt

      - name: Build US net liquidity proxy
        run: python net_liquidity/collector.py

      - name: Validate collection
        run: |
          python - <<'PY'
          import json, sys
          s=json.load(open('net_liquidity/state/collector_state.json'))
          print(s)
          if s.get('status') != 'OK':
              sys.exit('US net liquidity collector did not produce an OK snapshot')
          PY

      - name: Commit updated data
        run: |
          git config user.name "net-liquidity-bot"
          git config user.email "net-liquidity-bot@users.noreply.github.com"
          git add net_liquidity/data net_liquidity/output net_liquidity/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly US net liquidity proxy"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
