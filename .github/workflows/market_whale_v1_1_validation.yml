name: TEST MARKET Whale Recorder V1.1 Size

on:
  workflow_dispatch:
  push:
    branches:
      - market-whale-v1-1-size
    paths:
      - 'market_whales/collector_v1_1.py'
      - 'market_whales/config.json'
      - '.github/workflows/market_whale_v1_1_validation.yml'

permissions:
  contents: write

concurrency:
  group: test-market-whale-v1-1-size
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: market-whale-v1-1-size
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r market_whales/requirements.txt

      - name: Syntax + size-engine self-test
        run: |
          python -m py_compile market_whales/collector_v1_1.py
          python market_whales/collector_v1_1.py --self-test

      - name: Collect live Hyperliquid size baseline
        run: python market_whales/collector_v1_1.py

      - name: Validate V1.1 schema and migration safety
        run: |
          python - <<'PY'
          import csv,json,sys
          from pathlib import Path
          s=json.load(open('market_whales/state/recorder_state.json'))
          p=json.load(open('market_whales/output/latest_summary.json'))
          e=json.load(open('market_whales/output/latest_events.json'))
          if s.get('schema_version')!='1.1' or p.get('schema_version')!='1.1' or e.get('schema_version')!='1.1':
              sys.exit('wrong schema version')
          if s.get('change_basis')!='POSITION_SIZE_SZI' or p.get('change_basis')!='POSITION_SIZE_SZI':
              sys.exit('size change basis missing')
          if s.get('size_engine')!='PASS':
              sys.exit('size engine did not pass')
          q=s.get('queried_wallets',0); f=s.get('query_failures',0)
          if q<50 or (q+f and f/(q+f)>0.10):
              sys.exit('query coverage failed')
          # First V1.1 migration run must create size baselines and must not use legacy USD changes as whale actions.
          if s.get('size_baselines_created',0)<1:
              sys.exit('no size baselines created')
          for ev in e.get('events',[]):
              if ev.get('change_basis')!='POSITION_SIZE_SZI':
                  sys.exit('legacy value-based event leaked')
          with open('market_whales/data/positions_history.csv',newline='',encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          new=[r for r in rows if r.get('size_schema')=='SZI_V1_1']
          if not new or not any((r.get('position_size') or '').strip() for r in new):
              sys.exit('no szi history rows')
          print('V1_1_MIGRATION_VALIDATION=PASS', 'new_size_rows=',len(new),'baselines=',s.get('size_baselines_created'))
          PY

      - name: Save validation snapshot
        run: |
          git config user.name "market-whale-v1-1-test-bot"
          git config user.email "market-whale-v1-1-test-bot@users.noreply.github.com"
          git add market_whales/data market_whales/output market_whales/state
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "test: MARKET whale V1.1 size baseline snapshot"
            git pull --rebase origin market-whale-v1-1-size
            git push origin HEAD:market-whale-v1-1-size
          fi
