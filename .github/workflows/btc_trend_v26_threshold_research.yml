name: BTC TREND V2.6 Threshold Research

on:
  workflow_dispatch:
  push:
    branches:
      - btc-trend-v26-threshold-research
    paths:
      - 'btc_backtest/v26_threshold_research.py'
      - '.github/workflows/btc_trend_v26_threshold_research.yml'

permissions:
  contents: read

jobs:
  threshold-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas requests

      - name: Run V2.6 threshold research
        run: python btc_backtest/v26_threshold_research.py

      - name: Upload threshold research outputs
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v26-threshold-research-${{ github.run_id }}
          path: btc_backtest/output/v26_threshold_research/
          if-no-files-found: error
          retention-days: 14
