name: BTC TREND V2.6 TOP Fastpath Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - btc-trend-v26-top-fastpath-v1
    paths:
      - 'btc_trend_v26/top_fastpath_contract.json'
      - 'btc_trend_v26/top_fastpath_engine.py'
      - 'btc_trend_v26/test_top_fastpath_engine.py'
      - '.github/workflows/btc_trend_v26_top_fastpath.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'btc_trend_v26/top_fastpath_contract.json'
      - 'btc_trend_v26/top_fastpath_engine.py'
      - 'btc_trend_v26/test_top_fastpath_engine.py'
      - '.github/workflows/btc_trend_v26_top_fastpath.yml'

permissions:
  contents: read

jobs:
  top-fastpath-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Unit tests
        working-directory: btc_trend_v26
        run: python -m unittest -v test_top_fastpath_engine.py

      - name: Build current TOP shadow score
        run: python btc_trend_v26/top_fastpath_engine.py --output btc_trend_v26/output/latest_top_fastpath.json

      - name: Validate shadow safety and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('btc_trend_v26/output/latest_top_fastpath.json')
          x = json.loads(p.read_text())
          assert x.get('status') == 'OK_SHADOW', x
          assert float(x.get('coverage_pct', 0)) >= 50.0, x
          assert 0 <= int(x['top_score']) <= 100, x
          assert x.get('production_eligible') is False, x
          assert x.get('official_state_write_allowed') is False, x
          assert int(x.get('entry_gate_effect', -1)) == 0, x
          if x.get('intact_1d_bull_structure'):
              assert int(x['top_score']) <= 59, x
          print(json.dumps({
              'status': x['status'],
              'coverage_pct': x['coverage_pct'],
              'top_score': x['top_score'],
              'band': x['band'],
              'confirmed_1d_turn_down': x['confirmed_1d_turn_down'],
              'intact_1d_bull_structure': x['intact_1d_bull_structure'],
              'cap_59_applied': x['cap_59_applied'],
              'strong_confirmation_coverage_met': x['strong_confirmation_coverage_met']
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload TOP shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v26-top-fastpath-${{ github.run_id }}
          path: btc_trend_v26/output/latest_top_fastpath.json
          if-no-files-found: error
          retention-days: 14
