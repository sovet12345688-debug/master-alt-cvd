name: BTC V2.5 Backtest

on:
  push:
    branches: [main]
    paths:
      - 'btc_backtest/run_v25_backtest.py'
      - 'btc_backtest/diagnose_v25_backtest.py'
      - 'btc_backtest/diagnose_v25_tactical.py'
      - 'btc_backtest/diagnose_v25_stage_order.py'
      - 'btc_backtest/diagnose_v251_candidate.py'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas numpy
      - name: Run V2.5 backtest
        run: python btc_backtest/run_v25_backtest.py
      - name: Run V2.5 diagnostic pass
        run: python btc_backtest/diagnose_v25_backtest.py
      - name: Run tactical-invalidation sensitivity pass
        run: python btc_backtest/diagnose_v25_tactical.py
      - name: Run stage-order sensitivity pass
        run: python btc_backtest/diagnose_v25_stage_order.py
      - name: Run V2.5.1 pre-confirmation candidate pass
        run: python btc_backtest/diagnose_v251_candidate.py
      - name: Commit auditable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_backtest/output
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add MASTER BTC TREND V2.5 backtest results"
            git push
          fi
