name: BTC TREND V3 R2.5 FINAL FREEZE

on:
  push:
    branches: [btc-trend-v30-r25-full-risk-governor]
    paths:
      - 'btc_trend_v30/r25/r25_freeze_manifest.json'
      - 'btc_trend_v30/r25/r25_freeze_guard.py'
      - '.github/workflows/btc_trend_v30_r25_final_freeze.yml'
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/btc_trend_v30

jobs:
  final-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Parent PIT and contracts
        run: |
          set -euo pipefail
          (cd btc_trend_v30/r20 && python test_r20_engine_pit.py)
          python btc_trend_v30/r21/test_r21_contract.py
          python btc_trend_v30/r24/test_r24_contract.py
          python btc_trend_v30/r25/test_r25_contract.py
      - name: R2.5 freeze guard
        run: python btc_trend_v30/r25/r25_freeze_guard.py
      - name: Compile
        run: python -m py_compile btc_trend_v30/r25/r25_engine.py btc_trend_v30/r25/test_r25_contract.py btc_trend_v30/r25/r25_freeze_guard.py
      - name: Replay firewall
        run: |
          test ! -e btc_trend_v30/r25/output/historical_replay/audit.json
          echo R25_FINAL_FREEZE_REPLAY_COUNT=0
