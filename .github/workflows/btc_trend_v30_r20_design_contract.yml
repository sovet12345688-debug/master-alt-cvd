name: BTC TREND V3 R2.0 Design Contract

on:
  push:
    branches:
      - btc-trend-v30-r20-design
    paths:
      - 'btc_trend_v30/r20/**'
      - '.github/workflows/btc_trend_v30_r20_design_contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Candidate and frozen config identity + replay firewall
        run: |
          set -euo pipefail
          echo CANDIDATE_SHA256=$(sha256sum btc_trend_v30/r20/r20_candidate_config.json | awk '{print $1}')
          echo FROZEN_SHA256=$(sha256sum btc_trend_v30/r20/r20_frozen_config.json | awk '{print $1}')
          echo ENGINE_BLOB=$(git hash-object btc_trend_v30/r20/r20_engine.py)
          echo CONTRACT_BLOB=$(git hash-object btc_trend_v30/r20/r20_contract.py)
          test ! -e btc_trend_v30/r20/output/historical_replay/audit.json
          test ! -e btc_trend_v30/r20/output/full_replay/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('btc_trend_v30/r20')
          c=json.loads((p/'r20_candidate_config.json').read_text())
          f=json.loads((p/'r20_frozen_config.json').read_text())
          assert c['model']==f['model']=='MASTER_BTC_TREND_V3_R2_0'
          assert c['status']=='PRE_FREEZE_CANDIDATE_NO_REPLAY'
          assert f['status']=='FINAL_FROZEN_NO_REPLAY'
          assert f['freeze_metadata']['historical_replay_performed_before_freeze'] is False
          for k in ['evidence_firewall','data','features','long','short','holding','reset','predeclared_candidate_gates','forbidden']:
              assert c[k]==f[k], k
          print('FROZEN_SEMANTIC_IDENTITY_PASS')
          PY
      - name: Contract load
        working-directory: btc_trend_v30/r20
        run: python r20_contract.py
      - name: Engine load
        working-directory: btc_trend_v30/r20
        run: python r20_engine.py
      - name: Synthetic state-machine contract tests
        working-directory: btc_trend_v30/r20
        run: python test_r20_contract.py
      - name: PIT prefix and future-mutation tests
        working-directory: btc_trend_v30/r20
        run: python test_r20_engine_pit.py
      - name: Compile
        run: |
          python -m py_compile btc_trend_v30/r20/r20_contract.py
          python -m py_compile btc_trend_v30/r20/r20_engine.py
          python -m py_compile btc_trend_v30/r20/test_r20_contract.py
          python -m py_compile btc_trend_v30/r20/test_r20_engine_pit.py
