name: BTC TREND V3 R2.4 FINAL FREEZE

on:
  push:
    branches: [btc-trend-v30-r24-mature-bear-risk]
    paths:
      - '.github/workflows/btc_trend_v30_r24_final_freeze.yml'
  workflow_dispatch:

jobs:
  final-freeze:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/btc_trend_v30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Parent R2.1 and PIT
        run: |
          python btc_trend_v30/r21/r21_freeze_guard.py
          python btc_trend_v30/r21/test_r21_contract.py
          (cd btc_trend_v30/r20 && python test_r20_engine_pit.py)
      - name: R2.4 contract
        run: python btc_trend_v30/r24/test_r24_contract.py
      - name: R2.4 FINAL freeze guard
        run: python btc_trend_v30/r24/r24_freeze_guard.py
      - name: Explicit frozen identities
        run: |
          test "$(sha256sum btc_trend_v30/r24/r24_frozen_config.json | awk '{print $1}')" = "6358572604f79b4e376509b74fc977871e956175a3fba959aab7a583fa1a6a91"
          test "$(git hash-object btc_trend_v30/r24/r24_frozen_config.json)" = "be557a20ed9489fead93a62d9a33ec280b89cd44"
          test "$(git hash-object btc_trend_v30/r24/r24_engine.py)" = "a5a5d30d06bc4d99603e0fc92834f9a372794702"
          test "$(git hash-object btc_trend_v30/r24/test_r24_contract.py)" = "402644f0f8e3fb43b866c6ee0b053fa32c4b5cb8"
          test "$(git hash-object btc_trend_v30/r21/r21_engine.py)" = "b8a0d741ad59a98496d13b6b66a6a74763a27545"
          test "$(git hash-object btc_trend_v30/r21/r21_frozen_config.json)" = "5e2cab91781fb97519f4a37f9354c4ee545249e1"
          test ! -d btc_trend_v30/r24/output
          test ! -f btc_trend_v30/r24/r24_historical_diagnostic_replay.py
          echo R24_FINAL_FREEZE_IDENTITY=PASS
          echo R24_HISTORICAL_REPLAY_BEFORE_FREEZE=0
          echo R24_FINAL_FREEZE_REV=2
      - name: Compile
        run: python -m compileall -q btc_trend_v30/r24
