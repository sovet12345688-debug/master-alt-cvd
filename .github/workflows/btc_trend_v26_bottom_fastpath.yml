name: BTC TREND V2.6 BOTTOM Fastpath Shadow

on:
  workflow_dispatch:
  schedule:
    # KST 04:40 / 07:40 / 12:40 / 16:40 / 20:40. Active after merge to main.
    - cron: '40 3,7,11,19,22 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'btc_trend_v26/bottom_fastpath_contract.json'
      - 'btc_trend_v26/bottom_fastpath_engine.py'
      - 'btc_trend_v26/test_bottom_fastpath_engine.py'
      - 'state/master_btc_trend_v2_6_bottom_score_bridge_contract.json'
      - '.github/workflows/btc_trend_v26_bottom_fastpath.yml'
  push:
    branches:
      - main
      - btc-trend-v26-bottom-fastpath-v4
    paths:
      - 'btc_trend_v26/bottom_fastpath_contract.json'
      - 'btc_trend_v26/bottom_fastpath_engine.py'
      - 'btc_trend_v26/test_bottom_fastpath_engine.py'
      - 'state/master_btc_trend_v2_6_bottom_score_bridge_contract.json'
      - '.github/workflows/btc_trend_v26_bottom_fastpath.yml'

permissions:
  contents: read

jobs:
  bottom-fastpath-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Unit tests
        working-directory: btc_trend_v26
        run: python -m unittest -v test_bottom_fastpath_engine.py

      - name: Build current BOTTOM shadow score
        run: python btc_trend_v26/bottom_fastpath_engine.py --output btc_trend_v26/output/latest_bottom_fastpath.json

      - name: Validate limited display and build provenance
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path('btc_trend_v26/output')
          p = out / 'latest_bottom_fastpath.json'
          x = json.loads(p.read_text())
          assert x.get('status') == 'OK_SHADOW', x
          assert float(x.get('coverage_pct', 0)) >= 50.0, x
          assert 0 <= int(x['bottom_score']) <= 100, x
          assert x.get('production_eligible') is False, x
          assert x.get('official_state_write_allowed') is False, x
          assert int(x.get('entry_gate_effect', -1)) == 0, x
          assert int(x.get('long_short_effect', -1)) == 0, x
          assert int(x.get('live_plan_effect', -1)) == 0, x
          if not x.get('confirmed_1d_turn'):
              assert int(x['bottom_score']) <= 59, x

          score_sha = hashlib.sha256(p.read_bytes()).hexdigest()
          provenance = {
              'schema_version': '1.0',
              'provenance_contract': 'BTC_TREND_V26_BOTTOM_SCORE_PROVENANCE_V1',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID_VALUE']),
              'workflow_name': 'BTC TREND V2.6 BOTTOM Fastpath Shadow',
              'generated_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'score_sha256': score_sha,
              'coverage_pct': x['coverage_pct'],
              'coverage_grade': x['coverage_grade'],
              'bottom_score': x['bottom_score'],
              'band': x['band'],
              'confirmed_1d_turn': x['confirmed_1d_turn'],
              'strong_confirmation_coverage_met': x['strong_confirmation_coverage_met'],
              'allowed_output_scope': ['BOTTOM_SCORE','BOTTOM_BAND','BOTTOM_COVERAGE','BOTTOM_CONFIRMED_1D_TURN'],
              'engine_direct_official_state_write_allowed': False,
              'entry_gate_effect': 0,
              'long_short_effect': 0,
              'live_plan_effect': 0
          }
          (out / 'bottom_bridge_provenance.json').write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(provenance, ensure_ascii=False, indent=2))
          PY

      - name: Upload BOTTOM shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v26-bottom-fastpath-${{ github.run_id }}
          path: |
            btc_trend_v26/output/latest_bottom_fastpath.json
            btc_trend_v26/output/bottom_bridge_provenance.json
          if-no-files-found: error
          retention-days: 14
