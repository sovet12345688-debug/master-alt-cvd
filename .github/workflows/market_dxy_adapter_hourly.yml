name: MASTER MARKET DXY Adapter Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '56 * * * *'
  pull_request:
    paths:
      - 'market_vault/dxy_adapter.py'
      - '.github/workflows/market_dxy_adapter_hourly.yml'
  push:
    branches:
      - main
    paths:
      - 'market_vault/dxy_adapter.py'
      - '.github/workflows/market_dxy_adapter_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-market-dxy-adapter
  cancel-in-progress: false

jobs:
  dxy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Syntax
        run: python -m py_compile market_vault/dxy_adapter.py

      - name: Build DXY adapter output
        run: python market_vault/dxy_adapter.py

      - name: Validate DXY contract
        run: |
          python - <<'PY'
          import json
          s=json.load(open('market_vault/output/latest_summary.json',encoding='utf-8'))
          d=json.load(open('market_vault/output/latest_dxy.json',encoding='utf-8'))
          assert d['engine']=='MASTER_MARKET_DXY_ADAPTER_V1'
          m=d['metric']
          assert m['metric']=='DXY'
          assert m['source']=='Yahoo Finance:DX-Y.NYB'
          assert m['vs_24h'] is not None
          assert m['vs_3d'] is not None
          assert m['vs_7d'] is not None
          found=[x for x in s.get('metrics',[]) if x.get('metric')=='DXY']
          assert len(found)==1
          assert found[0]['source']=='Yahoo Finance:DX-Y.NYB'
          print('MASTER_MARKET_DXY_CONTRACT=PASS')
          PY

      - name: Commit DXY output on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "master-market-dxy-bot"
          git config user.email "master-market-dxy-bot@users.noreply.github.com"
          git add market_vault/output/latest_summary.json market_vault/output/latest_dxy.json
          if git diff --cached --quiet; then
            echo "No DXY output change"
            exit 0
          fi
          git commit -m "data: refresh MASTER MARKET DXY"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final result
        run: echo 'MASTER_MARKET_DXY_ADAPTER=PASS'
