name: BTC TREND V3 R2.3 PRE-FREEZE

on:
  push:
    branches: [btc-trend-v30-r23-detection-execution-separation]
    paths:
      - 'btc_trend_v30/r23/**'
      - '.github/workflows/btc_trend_v30_r23_pre_freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/btc_trend_v30

jobs:
  r23-pre-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Parent R2.1 integrity
        run: |
          python btc_trend_v30/r21/r21_freeze_guard.py
          python btc_trend_v30/r21/test_r21_contract.py
      - name: PIT availability 7 of 7
        run: (cd btc_trend_v30/r20 && python test_r20_engine_pit.py)
      - name: R2.3 detection-execution contract
        run: python btc_trend_v30/r23/test_r23_contract.py
      - name: Compile and replay firewall
        run: |
          python -m py_compile btc_trend_v30/r23/r23_detector.py btc_trend_v30/r23/test_r23_contract.py
          python btc_trend_v30/r23/r23_detector.py
          test ! -d btc_trend_v30/r23/output/historical_replay
          echo 'R23_PRE_FREEZE_PASS'
          echo 'R23_HISTORICAL_REPLAY_PERFORMED=false'
