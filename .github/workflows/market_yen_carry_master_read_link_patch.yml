name: MARKET Yen Carry Read-Link Patch

on:
  push:
    paths:
      - '.github/workflows/market_yen_carry_master_read_link_patch.yml'

permissions:
  contents: write

concurrency:
  group: market-yen-carry-read-link-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical and contract additively
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          source = json.loads(Path('market_yen_carry/output/latest_yen_carry.json').read_text(encoding='utf-8'))
          assert source.get('engine') == 'YEN_CARRY_RISK_LITE_V1'
          assert source.get('schema_version') == '1.0'
          assert source.get('score_weight') == 0
          assert source.get('status') in ('ok', 'partial')

          canonical_path = Path('master_prompts/master_market_v1_2_current.md')
          contract_path = Path('state/master_market_v1_2_contract.json')
          canonical = canonical_path.read_text(encoding='utf-8')
          contract = contract_path.read_text(encoding='utf-8')

          canonical_block = base64.b64decode('').decode('utf-8')
          top_block = base64.b64decode('').decode('utf-8')

          if '## YEN CARRY RISK LITE — SCREEN1 READ-ONLY ADDITIVE LOCK 2026-09-09' not in canonical:
              canonical = canonical.rstrip() + canonical_block + '\n'

          if '"schema_version": "1.10"' in contract:
              contract = contract.replace('"schema_version": "1.10"', '"schema_version": "1.11"', 1)
          elif '"schema_version": "1.11"' not in contract:
              raise SystemExit('Unexpected contract schema version')
          contract = contract.replace('"updated_kst": "2026-09-08T15:14:00+09:00"', '"updated_kst": "2026-09-09T12:49:00+09:00"', 1)

          required_marker = '    "short_term_whale_profit_taking_risk": ["STH unrealized-profit state proxy (not exact STH Whale)","STH-MVRV","STH-SOPR","Hyperliquid BTC whale NET","BTC CVD"],\n'
          if '"yen_carry_risk_lite": [' not in contract:
              if required_marker not in contract:
                  raise SystemExit('required_data marker missing')
              contract = contract.replace(required_marker, required_marker + '    "yen_carry_risk_lite": ["USDJPY current/1D/3D/7D","US-JP 10Y spread current/3D change","VIX current/1D change","Yen Carry Risk final score/level/easy_read - score weight 0"],\n', 1)

          source_marker = '    "short_term_whale_risk_proxy": "Read onchain/output/latest_short_term_whale_risk.json when fresh and engine/schema guards pass. STH metrics come from free public Checkonchain static Plotly HTML; exact CryptoQuant STH Whale is never claimed/reproduced. Hyperliquid NET and BTC CVD reuse existing validated MASTER outputs. No API key, paid source, backfill, interpolation, OCR, or guessed values."\n'
          if '"yen_carry_risk_lite": "Read market_yen_carry/output/latest_yen_carry.json' not in contract:
              if source_marker not in contract:
                  raise SystemExit('source_policy marker missing')
              replacement = source_marker[:-1] + ',\n    "yen_carry_risk_lite": "Read market_yen_carry/output/latest_yen_carry.json only when engine=YEN_CARRY_RISK_LITE_V1, schema_version=1.0, score_weight=0 and status/coverage guards pass. READ-ONLY SCREEN1 auxiliary; no MASTER recalculation, no cross-fill, no score/direction/Risk Veto/WATCH/DXY/BTC/whale/derivatives effect. Partial/null/stale/incompatible output => visible N/A and parent MASTER continues."\n'
              contract = contract.replace(source_marker, replacement, 1)

          screen1_marker = '      "oil remains mandatory and underlying Oil Hard Importance logic unchanged",\n'
          if 'Yen Carry Risk Lite read-only auxiliary:' not in contract:
              if screen1_marker not in contract:
                  raise SystemExit('screen1 marker missing')
              screen1_line = '      "Yen Carry Risk Lite read-only auxiliary: after main macro table and before BTC Liquidity Lead, read market_yen_carry/output/latest_yen_carry.json and show signal|item|current|1D|3D|7D|status plus final score/100 and easy Korean interpretation; score weight 0; failure stays visible N/A and does not block parent MASTER",\n'
              contract = contract.replace(screen1_marker, screen1_marker + screen1_line, 1)

          if '  "yen_carry_risk_lite": {\n' not in contract:
              top_marker = '  "whale_display_policy": {\n'
              if top_marker not in contract:
                  raise SystemExit('top-level marker missing')
              contract = contract.replace(top_marker, top_block + top_marker, 1)

          parsed = json.loads(contract)
          assert parsed['schema_version'] == '1.11'
          assert parsed['yen_carry_risk_lite']['score_weight'] == 0
          assert parsed['yen_carry_risk_lite']['guards']['read_only'] is True
          assert parsed['yen_carry_risk_lite']['output'] == 'market_yen_carry/output/latest_yen_carry.json'
          assert 'yen_carry_risk_lite' in parsed['required_data']
          assert 'yen_carry_risk_lite' in parsed['source_policy']
          assert any('Yen Carry Risk Lite read-only auxiliary:' in x for x in parsed['required_output']['screen1'])

          canonical_path.write_text(canonical, encoding='utf-8')
          contract_path.write_text(contract, encoding='utf-8')
          print('MASTER_YEN_CARRY_READ_LINK_PATCH=PASS')
          PY

      - name: Commit canonical and contract only
        run: |
          git config user.name "market-contract-bot"
          git config user.email "market-contract-bot@users.noreply.github.com"
          git add master_prompts/master_market_v1_2_current.md state/master_market_v1_2_contract.json
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "feat: connect Yen Carry Risk Lite read-only to MASTER MARKET"
          for n in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push retry $n"
            sleep $((n*5))
          done
          exit 1
