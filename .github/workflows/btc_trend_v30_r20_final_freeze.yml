name: BTC TREND V3 R2.0 FINAL FREEZE

on:
  push:
    branches:
      - btc-trend-v30-r20-design
    paths:
      - 'btc_trend_v30/r20/**'
      - '.github/workflows/btc_trend_v30_r20_final_freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Replay firewall before freeze
        run: |
          set -euo pipefail
          test ! -e btc_trend_v30/r20/output/historical_replay/audit.json
          test ! -e btc_trend_v30/r20/output/full_replay/audit.json
      - name: FINAL freeze guard
        run: python btc_trend_v30/r20/r20_freeze_guard.py
      - name: Candidate semantic contract
        working-directory: btc_trend_v30/r20
        run: python r20_contract.py
      - name: Engine implementation load
        working-directory: btc_trend_v30/r20
        run: python r20_engine.py
      - name: State-machine synthetic tests
        working-directory: btc_trend_v30/r20
        run: python test_r20_contract.py
      - name: PIT invariance battery
        working-directory: btc_trend_v30/r20
        run: python test_r20_engine_pit.py
      - name: Compile frozen implementation
        run: |
          python -m py_compile btc_trend_v30/r20/r20_freeze_guard.py
          python -m py_compile btc_trend_v30/r20/r20_contract.py
          python -m py_compile btc_trend_v30/r20/r20_engine.py
          python -m py_compile btc_trend_v30/r20/test_r20_contract.py
          python -m py_compile btc_trend_v30/r20/test_r20_engine_pit.py
      - name: Final identity print
        run: |
          set -euo pipefail
          echo FINAL_R20_FROZEN_SHA256=$(sha256sum btc_trend_v30/r20/r20_frozen_config.json | awk '{print $1}')
          echo FINAL_R20_ENGINE_BLOB=$(git hash-object btc_trend_v30/r20/r20_engine.py)
          echo FINAL_R20_CONTRACT_BLOB=$(git hash-object btc_trend_v30/r20/r20_contract.py)
          echo R20_HISTORICAL_REPLAY_BEFORE_FREEZE=0
