name: MASTER Derivatives Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - 'derivatives/collector.py'
      - 'derivatives/microstructure_collector.py'
      - 'derivatives/config.json'
      - '.github/workflows/derivatives_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-derivatives-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: derivatives/requirements.txt

      - name: Install dependencies
        run: pip install -r derivatives/requirements.txt

      - name: Collect live derivatives OI and funding
        run: python derivatives/collector.py

      - name: Collect Bitget CVD taker liquidation and basis
        run: python derivatives/microstructure_collector.py

      - name: Validate collection
        run: |
          python - <<'PY'
          import json, sys
          d=json.load(open('derivatives/state/collector_state.json'))
          m=json.load(open('derivatives/state/microstructure_state.json'))
          print('derivatives', d)
          print('microstructure', m)
          if d.get('ok_count', 0) < 1:
              sys.exit('No successful derivatives snapshots')
          if (m.get('ok_count', 0) + m.get('partial_count', 0)) < 1:
              sys.exit('No usable microstructure snapshots')
          PY

      - name: Commit updated data
        run: |
          git config user.name "derivatives-history-bot"
          git config user.email "derivatives-history-bot@users.noreply.github.com"
          git add derivatives/data derivatives/output derivatives/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly derivatives snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
