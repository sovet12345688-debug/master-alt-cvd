name: MASTER Derivatives Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - 'derivatives/collector.py'
      - 'derivatives/microstructure_collector.py'
      - 'derivatives/microstructure_collector_v2.py'
      - 'derivatives/config.json'
      - '.github/workflows/derivatives_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-derivatives-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: derivatives/requirements.txt

      - name: Install dependencies
        run: pip install -r derivatives/requirements.txt

      - name: Collect live derivatives OI and funding
        run: python derivatives/collector.py

      - name: Normalize exact derivatives windows after history gaps
        run: |
          python - <<'PY'
          import csv,json
          from datetime import datetime,timedelta
          hist_path='derivatives/data/hourly_derivatives.csv'
          json_path='derivatives/output/latest_summary.json'
          csv_path='derivatives/output/latest_summary.csv'
          with open(hist_path,newline='',encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          with open(json_path,encoding='utf-8') as fh:
              payload=json.load(fh)
          latest_s=payload.get('snapshot_time_utc')
          venue=payload.get('venue')
          latest=datetime.fromisoformat(latest_s.replace('Z','+00:00'))
          idx={(r.get('time_utc'),r.get('venue'),r.get('symbol')):r for r in rows}
          for a in payload.get('assets',[]):
              missing4=False
              for h in (1,4,24):
                  target=(latest-timedelta(hours=h)).isoformat().replace('+00:00','Z')
                  prior=idx.get((target,venue,a.get('symbol')))
                  exact_ok=bool(prior and prior.get('status')=='OK' and prior.get('open_interest_usdt'))
                  if not exact_ok:
                      a[f'price_change_{h}h_pct']=None
                      a[f'oi_change_{h}h_pct']=None
                      a[f'funding_change_{h}h']=None
                      if h==4:
                          missing4=True
              if a.get('status')=='OK' and missing4:
                  label='BUILDING_HISTORY'
                  fr=a.get('last_funding_rate')
                  if fr is not None and abs(fr) >= 0.001:
                      label += '|FUNDING_EXTREME'
                  a['derivatives_state']=label
          with open(json_path,'w',encoding='utf-8') as fh:
              json.dump(payload,fh,ensure_ascii=False,indent=2)
          fields=[
              'symbol','venue','time_utc','status','mark_price','open_interest_usdt','last_funding_rate',
              'price_change_1h_pct','oi_change_1h_pct','funding_change_1h',
              'price_change_4h_pct','oi_change_4h_pct','funding_change_4h',
              'price_change_24h_pct','oi_change_24h_pct','funding_change_24h','derivatives_state'
          ]
          with open(csv_path,'w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=fields)
              w.writeheader()
              for a in payload.get('assets',[]):
                  w.writerow({k:'' if a.get(k) is None else a.get(k,'') for k in fields})
          print('DERIVATIVES_EXACT_WINDOW_NORMALIZATION=PASS')
          PY

      - name: Collect Bitget free microstructure 7-field pack
        run: python derivatives/microstructure_collector_v2.py

      - name: Validate collection
        run: |
          python - <<'PY'
          import json, sys
          d=json.load(open('derivatives/state/collector_state.json'))
          m=json.load(open('derivatives/state/microstructure_state.json'))
          p=json.load(open('derivatives/output/latest_microstructure.json'))
          print('derivatives', d)
          print('microstructure', m)
          if d.get('ok_count', 0) < 1:
              sys.exit('No successful derivatives snapshots')
          if (m.get('ok_count', 0) + m.get('partial_count', 0)) < 1:
              sys.exit('No usable microstructure snapshots')
          if p.get('engine') != 'MASTER_DERIVATIVES_MICROSTRUCTURE_V2':
              sys.exit('Microstructure V2 output missing')
          required={'CVD','Taker Buy/Sell','Long/Short','Liquidation','Basis','Depth','Volume'}
          if set(p.get('free_public_fields') or []) != required:
              sys.exit('Microstructure 7-field contract mismatch')
          for a in p.get('assets',[]):
              if a.get('field_coverage',0) < 5:
                  sys.exit(f"Microstructure field coverage <5/7 for {a.get('symbol')}: {a.get('field_coverage')}")
          PY

      - name: Validate derivatives 24H FINAL QA integrity
        run: |
          python - <<'PY'
          import csv,json,sys
          from datetime import datetime,timedelta
          with open('derivatives/data/hourly_derivatives.csv',newline='',encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          state=json.load(open('derivatives/state/collector_state.json'))
          summary=json.load(open('derivatives/output/latest_summary.json'))
          venue=state.get('selected_venue')
          latest_s=state.get('snapshot_hour_utc')
          if not venue or not latest_s:
              sys.exit('FINAL_QA failed: missing selected venue/latest timestamp')
          latest=datetime.fromisoformat(latest_s.replace('Z','+00:00'))
          keys=set()
          for r in rows:
              k=(r.get('time_utc'),r.get('venue'),r.get('symbol'))
              if k in keys:
                  sys.exit(f'FINAL_QA failed: duplicate key {k}')
              keys.add(k)
          universe=int(state.get('universe_count') or 0)
          if universe <= 0:
              sys.exit('FINAL_QA failed: invalid universe_count')
          latest_rows=[r for r in rows if r.get('venue')==venue and r.get('time_utc')==latest_s]
          if len(latest_rows) < max(1,int(universe*0.90)):
              sys.exit(f'FINAL_QA failed: latest snapshot coverage <90% rows={len(latest_rows)} universe={universe}')
          assets=summary.get('assets',[])
          if len(assets) < max(1,int(universe*0.90)):
              sys.exit('FINAL_QA failed: latest summary coverage <90%')
          row_index={(r.get('time_utc'),r.get('venue'),r.get('symbol')):r for r in rows}
          missing_windows={1:0,4:0,24:0}
          for a in assets:
              if a.get('venue') != venue:
                  sys.exit(f'FINAL_QA failed: cross-venue summary row {a.get("symbol")}')
              if a.get('status')=='OK' and a.get('last_funding_rate') is None:
                  sys.exit(f'FINAL_QA failed: funding missing {a.get("symbol")}')
              if a.get('status')!='OK':
                  continue
              for h in (1,4,24):
                  target=(latest-timedelta(hours=h)).isoformat().replace('+00:00','Z')
                  prior=row_index.get((target,venue,a.get('symbol')))
                  exact_ok=bool(prior and prior.get('status')=='OK' and prior.get('open_interest_usdt'))
                  oi=a.get(f'oi_change_{h}h_pct')
                  if exact_ok and oi is None:
                      sys.exit(f'FINAL_QA failed: exact {h}H baseline exists but OI change missing {a.get("symbol")}')
                  if not exact_ok and oi is not None:
                      sys.exit(f'FINAL_QA failed: stale/non-exact {h}H OI baseline used {a.get("symbol")}')
                  if not exact_ok:
                      missing_windows[h]+=1
          print('DERIVATIVES_WINDOW_GAPS', missing_windows)
          print('DERIVATIVES_24H_FINAL_QA=PASS')
          PY

      - name: Commit updated data
        run: |
          git config user.name "derivatives-history-bot"
          git config user.email "derivatives-history-bot@users.noreply.github.com"
          git add derivatives/data derivatives/output derivatives/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly derivatives snapshot"
            max_attempts=5
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Push attempt ${attempt}/${max_attempts}"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict detected; aborting fail-closed."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Derivatives snapshot published successfully."
                exit 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Push failed after ${max_attempts} attempts."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
