name: MASTER Derivatives Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: master-derivatives-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: derivatives/requirements.txt

      - name: Install dependencies
        run: pip install -r derivatives/requirements.txt

      - name: Collect live derivatives OI and funding
        run: python derivatives/collector.py

      - name: Validate collection
        run: |
          python - <<'PY'
          import json, sys
          s=json.load(open('derivatives/state/collector_state.json'))
          print(s)
          if s.get('ok_count', 0) < 1:
              sys.exit('No successful derivatives snapshots')
          PY

      - name: Commit updated data
        run: |
          git config user.name "derivatives-history-bot"
          git config user.email "derivatives-history-bot@users.noreply.github.com"
          git add derivatives/data derivatives/output derivatives/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly derivatives snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
