name: BTC TREND V2.6 Feature Contract Validation

on:
  workflow_dispatch:
  push:
    branches:
      - btc-trend-v26-na-recovery-r1
    paths:
      - 'btc_trend_v26/feature_contract.json'
      - 'btc_trend_v26/validate_feature_contract.py'
      - '.github/workflows/btc_trend_v26_feature_contract_validation.yml'

permissions:
  contents: read

jobs:
  validate-feature-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate R1 feature contract
        run: python btc_trend_v26/validate_feature_contract.py
