name: MASTER MARKET Whale Side Display Lock

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_master_market_whale_side_display.py'
      - '.github/workflows/master_market_whale_side_display_lock.yml'

permissions:
  contents: write

concurrency:
  group: master-market-whale-side-display-lock
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply whale side traffic-light display lock
        run: python tools/patch_master_market_whale_side_display.py

      - name: Validate whale side display lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('master_prompts/master_market_v1_2_current.md').read_text(encoding='utf-8')
          c=json.load(open('state/master_market_v1_2_contract.json',encoding='utf-8'))
          assert 'WHALE SIDE TRAFFIC-LIGHT DISPLAY LOCK' in p
          assert '🟢 LONG' in p and '🔴 SHORT' in p
          wp=c.get('whale_display_policy') or {}
          assert wp.get('enabled') is True
          assert wp.get('long_display') == '🟢 LONG'
          assert wp.get('short_display') == '🔴 SHORT'
          assert wp.get('score_effect') == 0
          assert c.get('required_output',{}).get('screen_count') == 5
          print('MASTER_MARKET_WHALE_SIDE_DISPLAY_LOCK=PASS')
          PY

      - name: Commit canonical + contract lock
        run: |
          git config user.name "master-market-contract-bot"
          git config user.email "master-market-contract-bot@users.noreply.github.com"
          git add master_prompts/master_market_v1_2_current.md state/master_market_v1_2_contract.json
          if git diff --cached --quiet; then
            echo "No lock changes"
          else
            git commit -m "feat: show whale LONG SHORT with traffic lights"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
