name: BTC TREND V3.0 Phase2 Four Engine Validation

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/run_phase2_four_engines.py'
      - 'btc_trend_v30/run_phase2_v02.py'
      - '.github/workflows/btc_trend_v30_phase2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run Phase2 V0.2 prior-year calibrated four-engine research
        run: python btc_trend_v30/run_phase2_v02.py
      - name: Show compact verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='btc_trend_v30/output/phase2_v02/summary.json'
          d=json.load(open(p,encoding='utf-8'))
          print('ENGINE=',d['engine'])
          for k,v in d['stats'].items(): print(k,v['pass'],v['comparison'])
          print('SELECTOR=',d['selector'])
          print('OVERALL=',d['overall_stage'])
          PY
      - name: Upload Phase2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-phase2-v02
          path: btc_trend_v30/output/phase2_v02/
          retention-days: 14
