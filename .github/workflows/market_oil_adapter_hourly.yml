name: MASTER MARKET Oil Adapter Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '55 * * * *'
  pull_request:
    paths:
      - 'market_vault/oil_adapter.py'
      - '.github/workflows/market_oil_adapter_hourly.yml'
  push:
    branches:
      - main
    paths:
      - 'market_vault/oil_adapter.py'
      - '.github/workflows/market_oil_adapter_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-market-oil-adapter
  cancel-in-progress: false

jobs:
  oil:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Syntax
        run: python -m py_compile market_vault/oil_adapter.py

      - name: Build Oil adapter output
        run: python market_vault/oil_adapter.py

      - name: Validate Oil contract
        run: |
          python - <<'PY'
          import json
          s=json.load(open('market_vault/output/latest_summary.json',encoding='utf-8'))
          o=json.load(open('market_vault/output/latest_oil.json',encoding='utf-8'))
          assert o['engine']=='MASTER_MARKET_OIL_ADAPTER_V1'
          metrics={m['metric']:m for m in o['metrics']}
          assert set(metrics)=={'WTI','BRENT'}
          assert metrics['WTI']['source']=='Yahoo Finance:CL=F'
          assert metrics['BRENT']['source']=='Yahoo Finance:BZ=F'
          for name in ('WTI','BRENT'):
              for key in ('vs_24h','vs_3d','vs_7d'):
                  assert metrics[name][key] is not None, (name,key)
          merged={m.get('metric'):m for m in s.get('metrics',[])}
          assert merged['WTI']['source']=='Yahoo Finance:CL=F'
          assert merged['BRENT']['source']=='Yahoo Finance:BZ=F'
          print('MASTER_MARKET_OIL_CONTRACT=PASS')
          PY

      - name: Commit Oil output on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "master-market-oil-bot"
          git config user.email "master-market-oil-bot@users.noreply.github.com"
          git add market_vault/output/latest_summary.json market_vault/output/latest_oil.json
          if git diff --cached --quiet; then
            echo "No Oil output change"
            exit 0
          fi
          git commit -m "data: refresh MASTER MARKET oil"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final result
        run: echo 'MASTER_MARKET_OIL_ADAPTER=PASS'
