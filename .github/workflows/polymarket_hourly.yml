name: MASTER MARKET Polymarket Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
  push:
    paths:
      - 'polymarket/collector.py'
      - 'polymarket/config.json'
      - 'polymarket/requirements.txt'
      - '.github/workflows/polymarket_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-market-polymarket-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: polymarket/requirements.txt

      - name: Install
        run: pip install -r polymarket/requirements.txt

      - name: Syntax + self test
        run: |
          python -m py_compile polymarket/collector.py
          python polymarket/collector.py --mode self-test

      - name: Collect Polymarket expectation radar
        run: python polymarket/collector.py --mode collect

      - name: Validate output
        run: python polymarket/collector.py --mode validate

      - name: Guard MASTER policy
        run: |
          python - <<'PY'
          import json, sys
          p=json.load(open('polymarket/output/latest_summary.json'))
          s=json.load(open('polymarket/state/collector_state.json'))
          if p.get('score_weight') != 0:
              sys.exit('Polymarket must remain score_weight=0')
          if 'alone never alerts' not in (p.get('watch_policy') or '').lower():
              sys.exit('Polymarket single-signal watch guard missing')
          if len(p.get('top10') or []) < 5:
              sys.exit('Too few usable Polymarket markets')
          if s.get('auth_required') is not False:
              sys.exit('Unexpected authentication dependency')
          print('POLYMARKET_MASTER_GUARD=PASS')
          PY

      - name: Save hourly Polymarket snapshot
        run: |
          git config user.name "master-market-polymarket-bot"
          git config user.email "master-market-polymarket-bot@users.noreply.github.com"
          git add polymarket/data polymarket/output polymarket/state
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "data: hourly Polymarket expectation radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
