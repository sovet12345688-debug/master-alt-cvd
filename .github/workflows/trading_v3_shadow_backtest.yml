name: Trading V3 BTC ETH Shadow Backtest

# research workflow; second push after workflow creation intentionally triggers execution
on:
  push:
    branches: [trading-v3-swing-shadow-20260915]
    paths:
      - 'research/trading_v3_shadow/run_daily_v3_shadow.py'
      - '.github/workflows/trading_v3_shadow_backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: trading-v3-swing-shadow-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas numpy
      - name: Syntax check
        run: python -m py_compile research/trading_v3_shadow/run_daily_v3_shadow.py
      - name: Run BTC ETH V3 shadow research
        run: python research/trading_v3_shadow/run_daily_v3_shadow.py
      - name: Commit auditable shadow artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/trading_v3_shadow/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add Trading V3 BTC ETH shadow backtest results"
            git pull --rebase origin trading-v3-swing-shadow-20260915
            git push origin HEAD:trading-v3-swing-shadow-20260915
          fi
