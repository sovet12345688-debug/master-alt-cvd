name: Trading BTC Baseline Plus Edge Audit

on:
  push:
    branches: [trading-v3-shadow-bt-20260915]
    paths:
      - 'research/trading_v3_shadow_backtest/**'
      - '.github/workflows/trading_v3_shadow_backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-v3-shadow-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trading-v3-shadow-bt-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run BTC baseline plus V3 edge tier audit
        run: python research/trading_v3_shadow_backtest/run_btc_baseline_plus_tier_audit.py
      - name: Persist baseline plus outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/trading_v3_shadow_backtest/baseline_plus_output
          if git diff --cached --quiet; then
            echo 'No output changes to commit'
          else
            git commit -m 'research: persist BTC baseline-plus tier audit [skip ci]'
            git push origin HEAD:trading-v3-shadow-bt-20260915
          fi
