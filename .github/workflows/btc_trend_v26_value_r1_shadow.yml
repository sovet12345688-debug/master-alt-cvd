name: BTC TREND V2.6 Value R1 Shadow

on:
  workflow_dispatch:
  push:
    branches: [btc-trend-v26-value-r1]
    paths:
      - 'btc_trend_v26/value_overextension_engine_r1.py'
      - 'btc_trend_v26/value_overextension_contract_r1.json'
      - '.github/workflows/btc_trend_v26_value_r1_shadow.yml'

permissions:
  contents: read

jobs:
  value-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Value OOS and current candidate
        run: python btc_trend_v26/value_overextension_engine_r1.py --output btc_trend_v26/output/value_overextension_r1.json
      - name: Build baseline R2.2 features
        run: python btc_trend_v26/feature_engine_r22.py --output btc_trend_v26/output/latest_features_r22_value.json
      - name: Build shadow integrated features
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('btc_trend_v26/output')
          base=json.loads((out/'latest_features_r22_value.json').read_text())
          v=json.loads((out/'value_overextension_r1.json').read_text())
          base['schema_version']='1.4-value-r1'
          base['engine_id']='BTC_TREND_V26_FEATURE_ENGINE_VALUE_R1_SHADOW'
          base['features']['VALUE_OVEREXTENSION']=v['feature']
          base['value_shadow']={'promotion_gate':v['promotion_gate'],'checks':v['checks'],'production_approved':False}
          base['production_eligible']=False
          base['official_state_write_allowed']=False
          (out/'latest_features_value_r1.json').write_text(json.dumps(base,indent=2)+'\n')
          PY
      - name: Compute shadow trend score
        run: python btc_trend_v26/score_engine.py btc_trend_v26/output/latest_features_value_r1.json --output btc_trend_v26/output/latest_score_value_r1.json
      - name: Validate 7-point integration semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('btc_trend_v26/output')
          v=json.loads((out/'value_overextension_r1.json').read_text())
          s=json.loads((out/'latest_score_value_r1.json').read_text())
          assert v['status']=='SHADOW_CANDIDATE', v
          assert v['production_approved'] is False
          assert v['official_state_write_allowed'] is False
          if v['promotion_gate']=='PASS':
              comp=next(x for x in s['components'] if x['feature_id']=='VALUE_OVEREXTENSION')
              assert comp['weight']==7, comp
              behavior='CURRENT_ADDS_7'
          else:
              assert any(x['feature_id']=='VALUE_OVEREXTENSION' for x in s['unavailable_features']), s
              behavior='HOLD_ADDS_0'
          result={'status':'SHADOW_INTEGRATION_PASS','promotion_gate':v['promotion_gate'],'coverage_behavior':behavior,'coverage_pct':s.get('coverage_pct'),'long':s.get('long'),'short':s.get('short'),'trend_strength':s.get('trend_strength'),'production_approved':False}
          (out/'value_shadow_integration_r1.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v26-value-r1-${{ github.run_id }}
          path: |
            btc_trend_v26/output/value_overextension_r1.json
            btc_trend_v26/output/latest_score_value_r1.json
            btc_trend_v26/output/value_shadow_integration_r1.json
          retention-days: 14
