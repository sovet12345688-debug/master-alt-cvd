name: BTC TREND V3.0 Phase1 Origin Chart Validation

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/**'
      - '.github/workflows/btc_trend_v30_phase1_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  phase1-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run two-stage Trend Origin + Chart Structure walk-forward
        run: python btc_trend_v30/run_phase1_origin_chart_v02.py
      - name: Show compact verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='btc_trend_v30/output/phase1_v02/phase1_v02_summary.json'
          d=json.load(open(p,encoding='utf-8'))
          print('ENGINE=',d['engine'])
          print('STAGE=',d['stage'])
          print('TRUTH=',d['truth_counts'])
          print('LONG_OOS=',d['oos']['LONG_ORIGIN'])
          print('SHORT_OOS=',d['oos']['SHORT_ORIGIN'])
          print('GATES=',d['gates'])
          PY
      - name: Upload Phase1 V0.2 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-phase1-origin-chart-v02
          path: btc_trend_v30/output/phase1_v02/
          retention-days: 14
