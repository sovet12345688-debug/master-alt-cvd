name: BTC Fractal V2.6 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'btc_fractal/**'
      - '.github/workflows/btc_fractal_v26_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas numpy requests
      - name: Compile
        run: |
          python -m py_compile btc_fractal/run_v26_fractal.py
          python -m py_compile btc_fractal/run_v26_fast.py
          python -m py_compile btc_fractal/run_v26_v03.py
          python -m py_compile btc_fractal/run_v26_v031.py
          python -m py_compile btc_fractal/run_v26_v032.py
      - name: Build and validate V0.3.2
        run: python btc_fractal/run_v26_v032.py
      - name: Show summaries
        run: |
          cat btc_fractal/output/build_meta.json
          cat btc_fractal/output/v031_failure_analysis.json
          cat btc_fractal/output/current_v032.json
          cat btc_fractal/output/v032_validation_summary.json
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-fractal-v032-validation
          path: |
            btc_fractal/output/*.json
            btc_fractal/output/*.csv
            btc_fractal/data/event_registry.csv
          retention-days: 14
