name: BTC TREND V3 R2.0 FINAL FREEZE REV2

on:
  push:
    branches: [btc-trend-v30-r20-design]
    paths:
      - 'btc_trend_v30/r20/r20_frozen_config_rev2.json'
      - 'btc_trend_v30/r20/r20_freeze_manifest_rev2.json'
      - 'btc_trend_v30/r20/r20_freeze_guard_rev2.py'
      - 'btc_trend_v30/r20/R20_FINAL_FREEZE_REV2_SPEC.md'
      - '.github/workflows/btc_trend_v30_r20_final_freeze_rev2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-freeze-rev2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Replay firewall before REV2 freeze
        run: |
          set -euo pipefail
          test ! -e btc_trend_v30/r20/output/historical_replay/audit.json
          test ! -e btc_trend_v30/r20/output/full_replay/audit.json
      - name: REV2 freeze guard
        run: python btc_trend_v30/r20/r20_freeze_guard_rev2.py
      - name: State-machine contract
        working-directory: btc_trend_v30/r20
        run: python test_r20_contract.py
      - name: PIT availability battery
        working-directory: btc_trend_v30/r20
        run: python test_r20_engine_pit.py
      - name: Compile REV2 frozen implementation
        run: |
          python -m py_compile btc_trend_v30/r20/r20_freeze_guard_rev2.py
          python -m py_compile btc_trend_v30/r20/r20_engine.py
          python -m py_compile btc_trend_v30/r20/r20_contract.py
          python -m py_compile btc_trend_v30/r20/test_r20_engine_pit.py
      - name: Final REV2 identity
        run: |
          set -euo pipefail
          echo FINAL_R20_REV2_FROZEN_BLOB=$(git hash-object btc_trend_v30/r20/r20_frozen_config_rev2.json)
          echo FINAL_R20_REV2_ENGINE_BLOB=$(git hash-object btc_trend_v30/r20/r20_engine.py)
          echo FINAL_R20_REV2_CONTRACT_BLOB=$(git hash-object btc_trend_v30/r20/r20_contract.py)
          echo R20_HISTORICAL_REPLAY_BEFORE_REV2_FREEZE=0
