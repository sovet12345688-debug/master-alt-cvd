name: MASTER BTC TREND OFFICIAL State Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'official_state/inbox/btc_trend/*.json'
      - 'official_state/enqueue_btc_trend_official_state.py'
      - 'official_state/process_btc_trend_inbox.py'
      - 'official_state/check_btc_trend_persistence.py'
      - 'official_state/publish_official_state.py'
      - 'official_state/btc_trend_bridge_contract.json'
      - '.github/workflows/btc_trend_official_state_bridge.yml'

permissions:
  contents: write

concurrency:
  group: btc-trend-official-state-bridge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify persistence consistency before publish
        id: precheck
        shell: bash
        run: |
          set +e
          python official_state/check_btc_trend_persistence.py
          rc=$?
          echo "precheck_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture queued BTC TREND run ids
        id: queued
        if: steps.precheck.outputs.precheck_rc == '0'
        shell: bash
        run: |
          python - <<'PY' > /tmp/btc_run_ids.txt
          import json, pathlib
          root=pathlib.Path('official_state/inbox/btc_trend')
          for p in sorted(root.glob('*.json')):
              try:
                  s=json.load(open(p, encoding='utf-8'))
                  rid=(s.get('run') or {}).get('run_id')
                  if rid:
                      print(rid)
              except Exception:
                  pass
          PY
          echo "Queued run ids:"
          cat /tmp/btc_run_ids.txt || true

      - name: Process BTC TREND OFFICIAL inbox
        id: process
        if: steps.precheck.outputs.precheck_rc == '0'
        shell: bash
        run: |
          set +e
          python official_state/process_btc_trend_inbox.py
          rc=$?
          echo "bridge_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify synchronized publish targets
        id: verify
        if: steps.precheck.outputs.precheck_rc == '0' && steps.process.outputs.bridge_rc == '0'
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, pathlib, subprocess, sys
          queued_path=pathlib.Path('/tmp/btc_run_ids.txt')
          queued=[x.strip() for x in queued_path.read_text().splitlines() if x.strip()] if queued_path.exists() else []
          if queued:
              latest=json.load(open('official_state/latest/btc_trend.json', encoding='utf-8'))
              expected=queued[-1]
              rid=(latest.get('run') or {}).get('run_id')
              assert latest.get('state_status') == 'STORED', latest.get('state_status')
              assert rid == expected, (rid, expected)
          rc=subprocess.call([sys.executable, 'official_state/check_btc_trend_persistence.py'])
          if rc:
              raise SystemExit(rc)
          print('BTC_TREND_TARGET_VERIFY=PASS' + (f' run_id={queued[-1]}' if queued else ' no_input=true'))
          PY
          rc=$?
          echo "verify_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit successful synchronized publish
        if: steps.precheck.outputs.precheck_rc == '0' && steps.process.outputs.bridge_rc == '0' && steps.verify.outputs.verify_rc == '0'
        shell: bash
        run: |
          git config user.name "btc-trend-official-state-bot"
          git config user.email "btc-trend-official-state-bot@users.noreply.github.com"
          git add \
            official_state/inbox/btc_trend \
            official_state/rejected/btc_trend \
            official_state/latest/btc_trend.json \
            official_state/latest/index.json \
            official_state/history/btc_trend 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No material BTC TREND OFFICIAL state changes"
          else
            git commit -m "state: publish BTC TREND OFFICIAL run"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve rejection evidence without partial targets
        if: steps.precheck.outputs.precheck_rc == '0' && (steps.process.outputs.bridge_rc != '0' || steps.verify.outputs.verify_rc != '0')
        shell: bash
        run: |
          git restore --source=HEAD --staged --worktree \
            official_state/latest/btc_trend.json \
            official_state/latest/index.json \
            official_state/history/btc_trend 2>/dev/null || true
          git config user.name "btc-trend-official-state-bot"
          git config user.email "btc-trend-official-state-bot@users.noreply.github.com"
          git add official_state/inbox/btc_trend official_state/rejected/btc_trend 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: reject BTC TREND OFFICIAL payload"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Final bridge result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.precheck.outputs.precheck_rc }}" != "0" ]; then
            echo "BTC_TREND_OFFICIAL_STATE_BRIDGE=FAIL reason=PREEXISTING_PERSISTENCE_INCONSISTENCY"
            exit 1
          fi
          if [ "${{ steps.process.outputs.bridge_rc }}" != "0" ] || [ "${{ steps.verify.outputs.verify_rc }}" != "0" ]; then
            echo "BTC_TREND_OFFICIAL_STATE_BRIDGE=FAIL"
            exit 1
          fi
          echo "BTC_TREND_OFFICIAL_STATE_BRIDGE=PASS"
