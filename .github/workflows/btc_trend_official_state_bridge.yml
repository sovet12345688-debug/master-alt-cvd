name: MASTER BTC TREND OFFICIAL State Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'official_state/inbox/btc_trend/*.json'
      - 'official_state/process_btc_trend_inbox.py'
      - 'official_state/btc_trend_bridge_contract.json'
      - '.github/workflows/btc_trend_official_state_bridge.yml'

permissions:
  contents: write

concurrency:
  group: btc-trend-official-state-bridge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture queued BTC TREND run ids
        id: queued
        shell: bash
        run: |
          python - <<'PY' > /tmp/btc_run_ids.txt
          import json, pathlib
          root=pathlib.Path('official_state/inbox/btc_trend')
          for p in sorted(root.glob('*.json')):
              try:
                  s=json.load(open(p, encoding='utf-8'))
                  rid=(s.get('run') or {}).get('run_id')
                  if rid:
                      print(rid)
              except Exception:
                  pass
          PY
          echo "Queued run ids:"
          cat /tmp/btc_run_ids.txt || true

      - name: Process BTC TREND OFFICIAL inbox
        id: process
        shell: bash
        run: |
          set +e
          python official_state/process_btc_trend_inbox.py
          rc=$?
          echo "bridge_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify BTC TREND publish targets
        id: verify
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, pathlib, sys
          queued=[x.strip() for x in pathlib.Path('/tmp/btc_run_ids.txt').read_text().splitlines() if x.strip()]
          if not queued:
              print('BTC_TREND_TARGET_VERIFY=NO_INPUT_SMOKE_PASS')
              sys.exit(0)
          latest=json.load(open('official_state/latest/btc_trend.json', encoding='utf-8'))
          index=json.load(open('official_state/latest/index.json', encoding='utf-8'))
          rid=(latest.get('run') or {}).get('run_id')
          expected=queued[-1]
          assert latest.get('state_status') == 'STORED', latest.get('state_status')
          assert rid == expected, (rid, expected)
          ent=(index.get('masters') or {}).get('btc_trend') or {}
          assert ent.get('state_status') == 'STORED', ent
          assert ent.get('latest_official_run_id') == expected, ent
          hp=((latest.get('lineage') or {}).get('history_pointer'))
          assert hp, 'missing history_pointer'
          hist=pathlib.Path(hp)
          assert hist.exists(), hp
          text=hist.read_text(encoding='utf-8')
          assert f'"run_id":"{expected}"' in text or f'"run_id": "{expected}"' in text, expected
          print(f'BTC_TREND_TARGET_VERIFY=PASS run_id={expected}')
          PY
          rc=$?
          echo "verify_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit material bridge changes
        if: always()
        shell: bash
        run: |
          git config user.name "btc-trend-official-state-bot"
          git config user.email "btc-trend-official-state-bot@users.noreply.github.com"
          git add \
            official_state/inbox/btc_trend \
            official_state/rejected/btc_trend \
            official_state/latest \
            official_state/history/btc_trend 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No material BTC TREND OFFICIAL state changes"
          else
            git commit -m "state: publish BTC TREND OFFICIAL run"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Final bridge result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.process.outputs.bridge_rc }}" != "0" ] || [ "${{ steps.verify.outputs.verify_rc }}" != "0" ]; then
            echo "BTC_TREND_OFFICIAL_STATE_BRIDGE=FAIL"
            exit 1
          fi
          echo "BTC_TREND_OFFICIAL_STATE_BRIDGE=PASS"
