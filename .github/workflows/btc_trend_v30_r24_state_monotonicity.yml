name: BTC TREND V3 R2.4 STATE MONOTONICITY

on:
  push:
    branches: [btc-trend-v30-r24-mature-bear-risk]
    paths:
      - '.github/workflows/btc_trend_v30_r24_state_monotonicity.yml'
      - 'btc_trend_v30/r24/monotonicity/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r24-state-monotonicity:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/btc_trend_v30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Frozen R2.4 identity and PIT preflight
        run: |
          set -euo pipefail
          (cd btc_trend_v30/r20 && python test_r20_engine_pit.py)
          python btc_trend_v30/r21/test_r21_contract.py
          python btc_trend_v30/r24/test_r24_contract.py
          test "$(sha256sum btc_trend_v30/r24/r24_frozen_config.json | awk '{print $1}')" = "6358572604f79b4e376509b74fc977871e956175a3fba959aab7a583fa1a6a91"
          test "$(git hash-object btc_trend_v30/r24/r24_engine.py)" = "a5a5d30d06bc4d99603e0fc92834f9a372794702"
      - name: Download canonical validated Step1-10 artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-trend-v30-validation-v1-step1-10
          repository: sovet12345688-debug/master-alt-cvd
          run-id: 34084074525
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: btc_trend_v30/output/validation_v1
      - name: Canonical input SHA guard
        run: |
          python - <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path('btc_trend_v30/output/validation_v1')
          expected={
            'data_integrity/btc_usdt_1d_matrix.csv':'0618a36ffa0f98a3a3318927f0602bb288ff231fe9d10299b5f8013015a8964a',
            'step3_episode_dedupe/independent_episodes.csv':'aa4c9cc2f5c6bccfca71e65de4d7a81a64d9f0b8146fe06f416d9755f3ea467f',
            'step4_outcome_labels/episode_medium_long_truth_labels.csv':'5b8116fc14ef2e66ab48d67f132ead2881f363192d5ad6325902a3e8c7f4a9ce',
            'step6_state_machine_replay/btc_usdt_1h_matrix.csv':'259ba60e0b65df87591baa38628d1126b465342ff0a3848a9dabe348ad9fd729',
            'step6_state_machine_replay/btc_usdt_complete_4h_matrix.csv':'22bdc9bf33d54b8ebb850d209046365a326324059d48d3aac2afa33a0c366a26',
            'step7_metrics/audit.json':'1ab46eb52bb170cd1bc12bce3da8eabbc5478e83f3b358dc08e0a4b3604b323d',
          }
          ok=True
          for rel,want in expected.items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              print(rel, got, 'PASS' if got==want else 'FAIL')
              ok &= got==want
          if not ok: sys.exit(1)
          PY
      - name: Reproduce frozen R2.4 baseline
        run: |
          sed -i 's/manifest\["single_change_id"\]/manifest["single_change"]/g' btc_trend_v30/r24/r24_historical_diagnostic_replay_runner.py
          python btc_trend_v30/r24/r24_historical_diagnostic_replay_runner.py
      - name: State monotonicity diagnostic
        run: python btc_trend_v30/r24/monotonicity/r24_state_monotonicity_diagnostic.py
      - name: Audit integrity gate
        run: |
          python - <<'PY'
          import json,sys
          p='btc_trend_v30/r24/monotonicity/output/r24_state_monotonicity_audit.json'
          d=json.load(open(p))
          checks=[
            d['model']=='MASTER_BTC_TREND_V3_R2_4',
            d['status']=='R24_STATE_MONOTONICITY_HISTORICAL_DIAGNOSTIC_ONLY',
            d['production_promotion_evidence'] is False,
            all(d['baseline_identity']['checks'].values()),
            d['structural_invariants']['all_pass'] is True,
            d['primary_test']['result'] in {'PASS','FAIL'},
          ]
          print('R24_STATE_PRIMARY=',d['primary_test'])
          print('R24_STATE_REACHED=',d['reached_state_metrics'])
          print('R24_STATE_COMPARISONS=',d['adjacent_comparisons'])
          print('R24_STATE_EXCLUSIVE=',d['exclusive_max_state_secondary'])
          print('R24_STATE_INVARIANTS=',d['structural_invariants'])
          print('R24_STATE_GATE=',checks)
          if not all(checks): sys.exit(1)
          PY
      - name: Upload state monotonicity evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-r24-state-monotonicity
          path: btc_trend_v30/r24/monotonicity/output/
          retention-days: 14
