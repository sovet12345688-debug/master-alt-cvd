name: BTC Time Validity V2 Research

on:
  push:
    branches: [main]
    paths:
      - 'btc_backtest/time_validity_v2/run_time_validity_v2.py'
      - 'btc_backtest/time_validity_v2/run_time_validity_v2_entry.py'
      - 'btc_backtest/time_validity_v2/run_time_validity_v2_clean.py'
      - '.github/workflows/btc_time_validity_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas numpy
      - name: Syntax check
        run: |
          python -m py_compile btc_backtest/time_validity_v2/run_time_validity_v2.py
          python -m py_compile btc_backtest/time_validity_v2/run_time_validity_v2_clean.py
      - name: Run isolated time-validity research
        run: python btc_backtest/time_validity_v2/run_time_validity_v2_clean.py
      - name: Commit auditable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_backtest/output/time_validity_v2
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add BTC time-validity V2 research results"
            git pull --rebase origin main
            git push
          fi
