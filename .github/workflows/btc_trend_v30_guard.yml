name: BTC TREND V3.0 Research Guard

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/**'
      - '.github/workflows/btc_trend_v30_*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'btc_trend_v30/**'
      - '.github/workflows/btc_trend_v30_*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-trend-v30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate research isolation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(btc_trend_v30/|\.github/workflows/btc_trend_v30_[A-Za-z0-9_.-]+\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo 'Forbidden V3.0 research changes outside isolated scope:'
            echo "$bad"
            exit 1
          fi
          echo 'V3_RESEARCH_ISOLATION=PASS'
      - name: Validate all V3 workflows remain read-only
        shell: bash
        run: |
          set -euo pipefail
          files=$(find .github/workflows -maxdepth 1 -type f -name 'btc_trend_v30_*.yml' -print)
          test -n "$files"
          for f in $files; do
            echo "AUDIT $f"
            if grep -nE '^[[:space:]]+contents:[[:space:]]*write$|^[[:space:]]+pull-requests:[[:space:]]*write$|^[[:space:]]+(git push|gh api .*(-X|--method)[[:space:]]*(POST|PUT|PATCH|DELETE))' "$f"; then
              echo "Write-capable command/permission found in $f"
              exit 1
            fi
          done
          if ! grep -Eq '^  contents:[[:space:]]*read$' '.github/workflows/btc_trend_v30_guard.yml'; then
            echo 'V3 guard must keep contents read-only permission'
            exit 1
          fi
          echo 'V3_WORKFLOWS_READ_ONLY=PASS'
      - name: Validate frozen production directories are untouched
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(derivatives/|live_flow/|market_vault/|market_whales/|master_prompts/|state/master_market_)'; then
            echo 'Production/shared MASTER path touched by V3 research'
            exit 1
          fi
          echo 'PRODUCTION_PATHS_UNTOUCHED=PASS'
