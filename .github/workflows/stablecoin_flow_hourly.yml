name: MASTER Stablecoin Treasury Exchange Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'stablecoin_flow/collector.py'
      - 'stablecoin_flow/config.json'
      - 'stablecoin_flow/requirements.txt'
      - '.github/workflows/stablecoin_flow_hourly.yml'

permissions:
  contents: write

concurrency:
  group: master-stablecoin-flow-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: stablecoin_flow/requirements.txt

      - name: Install dependencies
        run: pip install -r stablecoin_flow/requirements.txt

      - name: Collect verified issuer-to-exchange stablecoin flows
        run: python stablecoin_flow/collector.py

      - name: Validate collection
        run: |
          python - <<'PY'
          import json, sys
          s=json.load(open('stablecoin_flow/state/collector_state.json'))
          print(s)
          if (s.get('ok_count',0) + s.get('partial_count',0)) < 1:
              sys.exit('No usable stablecoin flow snapshot')
          PY

      - name: Commit updated data
        run: |
          git config user.name "stablecoin-flow-bot"
          git config user.email "stablecoin-flow-bot@users.noreply.github.com"
          git add stablecoin_flow/data stablecoin_flow/output stablecoin_flow/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly stablecoin treasury exchange flow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
