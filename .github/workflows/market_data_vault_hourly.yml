name: MARKET Data Vault Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '52 * * * *'
  push:
    paths:
      - 'market_vault/collector_official.py'
      - 'market_vault/output_adapter.py'
      - 'market_vault/actor_freshness_guard.py'
      - 'market_vault/config.json'
      - '.github/workflows/market_data_vault_hourly.yml'

permissions:
  contents: write

concurrency:
  group: market-data-vault-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r market_vault/requirements.txt

      - name: Syntax + self test
        run: |
          python -m py_compile market_vault/collector_official.py
          python -m py_compile market_vault/output_adapter.py
          python -m py_compile market_vault/actor_freshness_guard.py
          python market_vault/collector_official.py --mode self-test

      - name: Collect same-source market history snapshot
        run: python market_vault/collector_official.py --mode collect

      - name: Build Stablecoin and actor actual-value adapters
        run: |
          python market_vault/output_adapter.py
          python market_vault/actor_freshness_guard.py

      - name: Validate current official-source coverage
        run: python market_vault/collector_official.py --mode validate

      - name: Validate comparison safety
        run: |
          python - <<'PY'
          import json,sys
          s=json.load(open('market_vault/state/vault_state.json'))
          p=json.load(open('market_vault/output/latest_summary.json'))
          if s.get('mandatory_ok',0)<5 or s.get('mandatory_total')!=6:
              sys.exit('CURRENT_QA failed: mandatory official coverage <5/6')
          if p.get('comparison_rule') != 'same metric + same source only; repeated retrieval of the same official observation is not new movement':
              sys.exit('comparison source-lock missing')
          for m in p.get('metrics',[]):
              for key in ('vs_prior_snapshot','vs_24h','vs_7d'):
                  b=m.get(key)
                  if b is not None and b.get('previous_snapshot_hour_utc') is None:
                      sys.exit(f'invalid comparison {m.get("metric")} {key}')
          print('MARKET_DATA_VAULT_COMPARISON_SAFETY=PASS')
          PY

      - name: Validate Stablecoin 3D 5D 7D 20D adapter and actual actor schema
        run: |
          python - <<'PY'
          import json,sys
          MAX_AGE_MIN=90.0
          st=json.load(open('market_vault/output/latest_stablecoin_windows.json'))
          ac=json.load(open('market_vault/output/latest_actor_flows.json'))
          if st.get('engine')!='MASTER_MARKET_STABLECOIN_WINDOWS_V1':
              sys.exit('wrong stablecoin adapter engine')
          for m in st.get('metrics',[]):
              if m.get('status')=='OK':
                  for k in ('vs_1d','vs_3d','vs_5d','vs_7d','vs_20d'):
                      if k not in m:
                          sys.exit(f'missing stablecoin window {m.get("metric")} {k}')
          if ac.get('engine')!='MASTER_MARKET_ACTOR_FLOW_ADAPTER_V1':
              sys.exit('wrong actor adapter engine')
          if ac.get('score_weight')!=0:
              sys.exit('actor adapter must have score_weight 0')
          if float(ac.get('retail_freshness_max_age_minutes',-1))!=MAX_AGE_MIN:
              sys.exit('actor retail freshness threshold mismatch')
          for coin in ('BTC','ETH'):
              inst=ac.get('institution',{}).get(coin,{})
              if 'flow_7d_usd_m' not in inst:
                  sys.exit(f'{coin} ETF 7D missing from actor adapter')
              wh=ac.get('whale',{}).get(coin,{})
              rp=ac.get('retail_proxy',{}).get(coin,{})
              for k in ('current','1d','3d','7d'):
                  if k not in wh or k not in rp:
                      sys.exit(f'{coin} actor comparison key missing {k}')
              status=rp.get('current_status')
              if status not in ('OK','STALE_UPSTREAM','MISSING_UPSTREAM'):
                  sys.exit(f'{coin} invalid retail freshness status {status}')
              if status=='OK':
                  age=rp.get('source_age_minutes')
                  if rp.get('current') is None or age is None or float(age)>MAX_AGE_MIN:
                      sys.exit(f'{coin} retail freshness contract violated age={age}')
              else:
                  if rp.get('current') is not None:
                      sys.exit(f'{coin} stale retail current must be N/A')
                  for k in ('1d','3d','7d'):
                      if rp.get(k) is not None:
                          sys.exit(f'{coin} stale retail comparison must be N/A: {k}')
          print('MARKET_ACTUAL_FLOW_ADAPTERS=PASS')
          print('MARKET_ACTOR_RETAIL_STATUS='+str(ac.get('retail_proxy_status')))
          PY

      - name: Assess MARKET vault history health without blocking current recovery
        run: |
          python - <<'PY'
          import csv,json,sys
          from datetime import datetime,timedelta,timezone
          from pathlib import Path

          hist_path=Path('market_vault/data/market_history.csv')
          state_path=Path('market_vault/state/vault_state.json')
          summary_path=Path('market_vault/output/latest_summary.json')

          with hist_path.open(newline='',encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          s=json.loads(state_path.read_text(encoding='utf-8'))
          p=json.loads(summary_path.read_text(encoding='utf-8'))

          latest_s=s.get('snapshot_hour_utc')
          if not latest_s:
              sys.exit('CURRENT_QA failed: missing latest snapshot hour')
          latest=datetime.fromisoformat(latest_s.replace('Z','+00:00'))

          # Structural corruption remains fatal. Missing historical windows do not.
          keys=set()
          for r in rows:
              k=(r.get('snapshot_hour_utc'),r.get('metric'),r.get('source'))
              if k in keys:
                  sys.exit(f'CURRENT_QA failed: duplicate key {k}')
              keys.add(k)

          mandatory={'US2Y','US10Y','US30Y','US10Y_REAL','EFFR','TGA_CLOSING_BALANCE'}
          metrics={m.get('metric'):m for m in p.get('metrics',[])}
          current_present=len(mandatory & set(metrics))
          if current_present < 5:
              sys.exit(f'CURRENT_QA failed: mandatory current summary coverage <5/6 ({current_present})')

          issues=[]
          stamps=sorted({datetime.fromisoformat(r['snapshot_hour_utc'].replace('Z','+00:00')) for r in rows if r.get('snapshot_hour_utc')})
          recent=[t for t in stamps if latest-timedelta(hours=25) <= t <= latest]
          if len(recent) < 20:
              issues.append(f'production timestamps <20 in ~26H ({len(recent)})')

          gaps=[(b-a).total_seconds()/3600 for a,b in zip(recent,recent[1:])]
          max_gap=max(gaps) if gaps else 0.0
          if max_gap > 2.1:
              issues.append(f'abnormal hourly gap max={max_gap:.2f}h')

          with24=0
          missing24=[]
          for name in sorted(mandatory):
              m=metrics.get(name)
              if not m:
                  continue
              b=m.get('vs_24h')
              if b is not None:
                  if b.get('previous_snapshot_hour_utc') is None:
                      sys.exit(f'CURRENT_QA failed: invalid 24h comparison {name}')
                  with24 += 1
              else:
                  missing24.append(name)
          if with24 < 5:
              issues.append(f'mandatory actual 24H comparisons <5 ({with24}); missing={missing24}')

          history_status='DEGRADED_HISTORY' if issues else 'OK'
          checked_at=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')

          s['current_collection_status']='OK'
          s['history_status']=history_status
          s['history_recovery_mode']=bool(issues)
          s['history_recent_timestamp_count_26h']=len(recent)
          s['history_gap_max_hours']=round(max_gap,4)
          s['history_24h_comparison_count']=with24
          s['history_issues']=issues
          s['history_health_checked_at_utc']=checked_at
          state_path.write_text(json.dumps(s,ensure_ascii=False,indent=2),encoding='utf-8')

          collection=p.setdefault('collection',{})
          collection['current_collection_status']='OK'
          collection['history_status']=history_status
          collection['history_recovery_mode']=bool(issues)
          collection['history_recent_timestamp_count_26h']=len(recent)
          collection['history_gap_max_hours']=round(max_gap,4)
          collection['history_24h_comparison_count']=with24
          collection['history_issues']=issues
          collection['history_health_checked_at_utc']=checked_at
          summary_path.write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding='utf-8')

          print('MARKET_DATA_VAULT_CURRENT_QA=PASS')
          print('MARKET_DATA_VAULT_HISTORY_STATUS='+history_status)
          for issue in issues:
              print('HISTORY_WARNING='+issue)
          PY

      - name: Save hourly market snapshot
        run: |
          git config user.name "market-data-vault-bot"
          git config user.email "market-data-vault-bot@users.noreply.github.com"
          git add market_vault/data market_vault/output market_vault/state
          if git diff --cached --quiet; then
            echo "No generated MARKET vault data changes"
          else
            git commit -m "data: refresh MARKET vault and actual-flow adapters"
            max_attempts=5
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Push attempt ${attempt}/${max_attempts}"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict detected; aborting fail-closed."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "MARKET vault snapshot published successfully."
                exit 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Push failed after ${max_attempts} attempts."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
