name: MASTER Derivatives Validation

on:
  push:
    branches: [derivatives-engine-v1]
    paths:
      - 'derivatives/collector.py'
      - 'derivatives/config.json'
      - 'derivatives/requirements.txt'
      - '.github/workflows/derivatives_test_once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-derivatives-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: derivatives-engine-v1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r derivatives/requirements.txt

      - name: Syntax check
        run: python -m py_compile derivatives/collector.py

      - name: Live collection test
        run: python derivatives/collector.py

      - name: Show validation summary
        run: |
          cat derivatives/state/collector_state.json
          python - <<'PY'
          import json
          p=json.load(open('derivatives/output/latest_summary.json'))
          print('assets=',len(p['assets']))
          print('ok=',sum(x['status']=='OK' for x in p['assets']))
          print('na=',sum(x['status']!='OK' for x in p['assets']))
          for x in p['assets']:
              print(x['symbol'], x['status'], x.get('derivatives_state'))
          PY

      - name: Commit validation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derivatives/data derivatives/output derivatives/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "test: derivatives validation snapshot"
            git push origin HEAD:derivatives-engine-v1
          fi
