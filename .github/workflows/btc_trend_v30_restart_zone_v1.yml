name: BTC TREND V3.0 Restart Zone V1

on:
  push:
    branches: [btc-trend-v30-restart-20260905]
    paths:
      - 'btc_trend_v30/**'
      - '.github/workflows/btc_trend_v30_restart_zone_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zone-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Compile
        run: python -m py_compile btc_trend_v30/run_restart_phase1_v1.py btc_trend_v30/run_restart_zone_v1.py
      - name: Run pre-touch Zone Quality v1
        run: python btc_trend_v30/run_restart_zone_v1.py
      - name: Show compact verdict
        run: |
          python - <<'PY'
          import json
          p='btc_trend_v30/output/restart_zone_v1/summary.json'
          d=json.load(open(p,encoding='utf-8'))
          print('LONG=',d['LONG'])
          print('SHORT=',d['SHORT'])
          print('ZONE_GATE=',d['zone_quality_gate'])
          print('MASTER_MODIFIED=',d['master_btc_trend_v26_modified'])
          PY
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-restart-zone-v1
          path: btc_trend_v30/output/restart_zone_v1/
          retention-days: 14
