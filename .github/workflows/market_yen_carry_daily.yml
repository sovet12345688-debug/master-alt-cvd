name: MARKET Yen Carry Risk Lite Daily

on:
  workflow_dispatch:
  schedule:
    # 08:35 KST Monday-Friday = 23:35 UTC Sunday-Thursday.
    # This finishes before the 09:00 KST MASTER MARKET OFFICIAL run.
    - cron: '35 23 * * 0-4'
  push:
    paths:
      - 'market_yen_carry/collector.py'
      - 'market_yen_carry/config.json'
      - '.github/workflows/market_yen_carry_daily.yml'

permissions:
  contents: write

concurrency:
  group: market-yen-carry-risk-lite-daily
  cancel-in-progress: true

jobs:
  refresh-yen-carry-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build yen carry risk lite output
        run: |
          python -m py_compile market_yen_carry/collector.py
          python market_yen_carry/collector.py

      - name: Validate output contract and source freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('market_yen_carry/output/latest_yen_carry.json')
          config_path = Path('market_yen_carry/config.json')
          if not path.exists():
              raise SystemExit('latest_yen_carry.json missing')

          data = json.loads(path.read_text(encoding='utf-8'))
          config = json.loads(config_path.read_text(encoding='utf-8'))
          if data.get('engine') != 'YEN_CARRY_RISK_LITE_V1':
              raise SystemExit('wrong engine')
          if data.get('schema_version') != '1.0':
              raise SystemExit('wrong schema_version')
          if data.get('score_weight') != 0:
              raise SystemExit('score_weight must remain 0')
          if data.get('status') not in ('ok', 'partial'):
              raise SystemExit('invalid status')

          expected_freshness = config.get('source_freshness_days') or {}
          actual_freshness = data.get('source_freshness_days') or {}
          required_sources = {'usd_jpy', 'us10y', 'jp10y', 'vix'}
          if set(expected_freshness) != required_sources:
              raise SystemExit(f'invalid source_freshness_days config: {expected_freshness}')
          if actual_freshness != expected_freshness:
              raise SystemExit(f'freshness policy mismatch output={actual_freshness} config={expected_freshness}')

          sources = data.get('sources') or {}
          for name in sorted(required_sources):
              source = sources.get(name)
              if not isinstance(source, dict):
                  raise SystemExit(f'missing source metadata: {name}')
              if source.get('status') == 'error':
                  continue
              age = source.get('source_age_days')
              max_age = source.get('freshness_max_age_days')
              if not isinstance(age, int) or not isinstance(max_age, int):
                  raise SystemExit(f'missing freshness metadata: {name}')
              if max_age != expected_freshness[name]:
                  raise SystemExit(f'wrong freshness threshold for {name}: {max_age}')
              if age > max_age:
                  raise SystemExit(f'stale source escaped guard: {name} age={age} max={max_age}')

          coverage = data.get('coverage_pct')
          if not isinstance(coverage, int) or not 0 <= coverage <= 100:
              raise SystemExit('invalid coverage_pct')

          final_score = (data.get('risk') or {}).get('final_score')
          if data['status'] == 'ok':
              if coverage != 100:
                  raise SystemExit('ok status requires 100% coverage')
              if not isinstance(final_score, int) or not 0 <= final_score <= 100:
                  raise SystemExit('ok status requires integer final_score 0..100')
          else:
              if final_score is not None:
                  raise SystemExit('partial status must not publish final_score')

          print(
              'YEN_CARRY_RISK_LITE_VALIDATION=PASS',
              f"status={data['status']}",
              f"coverage={coverage}",
              f"score={final_score}",
              f"freshness={actual_freshness}",
          )
          PY

      - name: Commit yen carry output only
        run: |
          git config user.name "market-yen-carry-bot"
          git config user.email "market-yen-carry-bot@users.noreply.github.com"
          git add market_yen_carry/output/latest_yen_carry.json

          if git diff --cached --quiet; then
            echo "No yen-carry output changes"
            exit 0
          fi

          git commit -m "data: refresh MARKET yen carry risk lite"

          for n in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push retry $n"
            sleep $((n*5))
          done
          exit 1
