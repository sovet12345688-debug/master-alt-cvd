name: BTC TREND R2.6 READ ONLY UI SYNC

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/btc_trend_r26_ui_sync_patch.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply read-only UI patch
        run: python tools/patch_btc_trend_r26_readonly_ui.py

      - name: Validate diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 4
          git diff --name-only | grep -qx 'master_prompts/master_btc_trend_v2_6_current.md'
          git diff --name-only | grep -qx 'master_prompts/master_btc_trend_v2_6_ui_final.md'
          git diff --name-only | grep -qx 'state/master_btc_trend_v2_6_contract.json'
          git diff --name-only | grep -qx 'money_master_os/masters/btc_trend/manifest.json'
          if git diff --name-only | grep -q '^btc_trend_v30/r26/'; then exit 1; fi

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'btc-trend-ui-sync-bot'
          git config user.email 'btc-trend-ui-sync-bot@users.noreply.github.com'
          git add master_prompts/master_btc_trend_v2_6_current.md master_prompts/master_btc_trend_v2_6_ui_final.md state/master_btc_trend_v2_6_contract.json money_master_os/masters/btc_trend/manifest.json
          git commit -m 'BTC Trend V2.6: require BTC leading signal read-only block'
          git push origin HEAD:main
