name: BTC TREND V3 R2.4 FREEZE PROBE

on:
  push:
    branches: [btc-trend-v30-r24-mature-bear-risk]
    paths:
      - '.github/workflows/btc_trend_v30_r24_freeze_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/btc_trend_v30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Parent/PIT/R2.4 contract
        run: |
          python btc_trend_v30/r21/r21_freeze_guard.py
          python btc_trend_v30/r21/test_r21_contract.py
          (cd btc_trend_v30/r20 && python test_r20_engine_pit.py)
          python btc_trend_v30/r24/test_r24_contract.py
      - name: Frozen identity
        run: |
          echo R24_FROZEN_SHA256=$(sha256sum btc_trend_v30/r24/r24_frozen_config.json | awk '{print $1}')
          echo R24_FROZEN_BLOB=$(git hash-object btc_trend_v30/r24/r24_frozen_config.json)
          echo R24_ENGINE_BLOB=$(git hash-object btc_trend_v30/r24/r24_engine.py)
          echo R24_CONTRACT_BLOB=$(git hash-object btc_trend_v30/r24/test_r24_contract.py)
          echo R21_ENGINE_BLOB=$(git hash-object btc_trend_v30/r21/r21_engine.py)
          echo R21_FROZEN_BLOB=$(git hash-object btc_trend_v30/r21/r21_frozen_config.json)
          test ! -d btc_trend_v30/r24/output
          test ! -f btc_trend_v30/r24/r24_historical_diagnostic_replay.py
          echo R24_HISTORICAL_REPLAY_BEFORE_FREEZE=0
          echo R24_PROBE_REV=2
