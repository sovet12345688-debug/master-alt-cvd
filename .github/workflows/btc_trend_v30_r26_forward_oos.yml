name: BTC TREND V3 R2.6 FORWARD OOS

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4,8,12,20,23 * * *'

permissions:
  contents: write

concurrency:
  group: btc-trend-v30-r26-forward-oos
  cancel-in-progress: false

jobs:
  forward-oos:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/btc_trend_v30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btc-trend-v30-r26-final-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Frozen identity and PIT contract
        run: |
          set -euo pipefail
          (cd btc_trend_v30/r20 && python test_r20_engine_pit.py)
          python btc_trend_v30/r25/test_r25_contract.py
          python btc_trend_v30/r26/r26_freeze_guard.py
          python btc_trend_v30/r26/test_r26_contract.py
          echo 'R26_FORWARD_PRECHECK_PASS=1' >> "$GITHUB_ENV"

      - name: Run official Forward OOS tracker
        run: |
          set -euo pipefail
          python btc_trend_v30/r26/forward_oos/forward_tracker.py

      - name: Build same-run provenance manifest
        env:
          R26_WORKFLOW_RUN_ID: ${{ github.run_id }}
          R26_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          R26_WORKFLOW_SHA: ${{ github.sha }}
          R26_WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          base = Path('btc_trend_v30/r26/forward_oos')
          tracked = [
              'latest.md', 'state.json', 'detections.csv', 'events.csv',
              'seeds.csv', 'positions.csv', 'transactions.csv',
              'ledger_integrity_report.json', 'scorecard.json'
          ]

          def sha256_file(path: Path):
              if not path.exists():
                  return None
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          hashes = {name: sha256_file(base / name) for name in tracked}
          # The user-visible snapshot identity is anchored to latest.md + state.json.
          anchor = json.dumps({
              'latest.md': hashes['latest.md'],
              'state.json': hashes['state.json'],
          }, sort_keys=True, separators=(',', ':')).encode()
          snapshot_hash = hashlib.sha256(anchor).hexdigest()

          manifest = {
              'schema_version': '1.0',
              'provenance_contract': 'R26_SAME_RUN_PROVENANCE_V1',
              'workflow_name': 'BTC TREND V3 R2.6 FORWARD OOS',
              'workflow_run_id': int(os.environ['R26_WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['R26_WORKFLOW_RUN_ATTEMPT']),
              'workflow_trigger_sha': os.environ.get('R26_WORKFLOW_SHA'),
              'workflow_ref': os.environ.get('R26_WORKFLOW_REF'),
              'source_branch': 'btc-trend-v30-r26-final-integration',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'snapshot_hash_sha256': snapshot_hash,
              'snapshot_hash_basis': ['latest.md', 'state.json'],
              'file_sha256': hashes,
              'expected_artifact_name': f"r26-forward-oos-{os.environ['R26_WORKFLOW_RUN_ID']}",
              'verification_rule': 'MATCH_RUN_ID_AND_RECOMPUTED_SNAPSHOT_HASH_THEN_REQUIRE_WORKFLOW_COMPLETED_SUCCESS',
          }
          (base / 'provenance.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'workflow_run_id': manifest['workflow_run_id'],
              'snapshot_hash_sha256': snapshot_hash,
              'expected_artifact_name': manifest['expected_artifact_name'],
          }, sort_keys=True))
          PY

      - name: Frozen Forward ledger integrity guard
        run: |
          set -euo pipefail
          test "$(git hash-object btc_trend_v30/r26/forward_oos/R26_FORWARD_LEDGER_GUARD_FREEZE_MANIFEST_V1.json)" = "aaa9fda112cede84a3331e80d8b21252bcef611f"
          test "$(git hash-object btc_trend_v30/r26/forward_oos/R26_FORWARD_LEDGER_INTEGRITY_SPEC_V1.json)" = "49efdab5da40d88f03a3dcf9ede3830ef31f71e3"
          test "$(git hash-object btc_trend_v30/r26/forward_oos/ledger_integrity_guard.py)" = "191884d064bf29f09c6567ce2978e51f2af65022"
          test "$(git hash-object btc_trend_v30/r26/forward_oos/ledger_integrity_guard_selftest.py)" = "ef2d0f783f896a29118c44f270baa726432a9c0c"
          python btc_trend_v30/r26/forward_oos/ledger_integrity_guard_selftest.py
          python btc_trend_v30/r26/forward_oos/ledger_integrity_guard.py

      - name: Frozen Forward scorecard evaluator guard
        run: |
          set -euo pipefail
          test "$(git hash-object btc_trend_v30/r26/forward_oos/R26_FORWARD_SCORECARD_FREEZE_MANIFEST_V1.json)" = "325a18ded37cef92be8b4054813c9d59ccfccb60"
          test "$(git hash-object btc_trend_v30/r26/forward_oos/scorecard_freeze_guard.py)" = "bdde48842e5851f6b58b22d7d3b4893e0459d70d"
          python btc_trend_v30/r26/forward_oos/scorecard_freeze_guard.py

      - name: Build automatic Forward scorecard
        run: |
          set -euo pipefail
          python btc_trend_v30/r26/forward_oos/forward_scorecard.py

      - name: Refresh provenance after guards and scorecard
        env:
          R26_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base = Path('btc_trend_v30/r26/forward_oos')
          p = base / 'provenance.json'
          manifest = json.loads(p.read_text(encoding='utf-8'))
          for name in ['ledger_integrity_report.json', 'scorecard.json']:
              path = base / name
              if path.exists():
                  manifest['file_sha256'][name] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest['workflow_run_id'] = int(os.environ['R26_WORKFLOW_RUN_ID'])
          p.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Verify provenance join before commit
        env:
          R26_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base = Path('btc_trend_v30/r26/forward_oos')
          manifest = json.loads((base / 'provenance.json').read_text(encoding='utf-8'))
          assert manifest['workflow_run_id'] == int(os.environ['R26_WORKFLOW_RUN_ID'])
          assert manifest['expected_artifact_name'] == f"r26-forward-oos-{os.environ['R26_WORKFLOW_RUN_ID']}"
          hashes = {}
          for name in ['latest.md', 'state.json']:
              hashes[name] = hashlib.sha256((base / name).read_bytes()).hexdigest()
              assert manifest['file_sha256'][name] == hashes[name]
          anchor = json.dumps(hashes, sort_keys=True, separators=(',', ':')).encode()
          assert hashlib.sha256(anchor).hexdigest() == manifest['snapshot_hash_sha256']
          print('R26_PROVENANCE_JOIN_PRECOMMIT_PASS=1')
          PY

      - name: Commit tracker, integrity, scorecard and provenance ledger
        run: |
          set -euo pipefail
          git config user.name 'r26-forward-oos-bot'
          git config user.email 'r26-forward-oos-bot@users.noreply.github.com'
          git add btc_trend_v30/r26/forward_oos/detections.csv \
                  btc_trend_v30/r26/forward_oos/events.csv \
                  btc_trend_v30/r26/forward_oos/seeds.csv \
                  btc_trend_v30/r26/forward_oos/positions.csv \
                  btc_trend_v30/r26/forward_oos/transactions.csv \
                  btc_trend_v30/r26/forward_oos/state.json \
                  btc_trend_v30/r26/forward_oos/latest.md \
                  btc_trend_v30/r26/forward_oos/runs.jsonl \
                  btc_trend_v30/r26/forward_oos/ledger_integrity_state.json \
                  btc_trend_v30/r26/forward_oos/ledger_integrity_runs.jsonl \
                  btc_trend_v30/r26/forward_oos/ledger_integrity_report.json \
                  btc_trend_v30/r26/forward_oos/scorecard.json \
                  btc_trend_v30/r26/forward_oos/scorecard.md \
                  btc_trend_v30/r26/forward_oos/scorecard_runs.jsonl \
                  btc_trend_v30/r26/forward_oos/forward_truth_episodes.csv \
                  btc_trend_v30/r26/forward_oos/forward_truth_mcr.csv \
                  btc_trend_v30/r26/forward_oos/state_monotonicity.csv \
                  btc_trend_v30/r26/forward_oos/cycle_buckets.csv \
                  btc_trend_v30/r26/forward_oos/provenance.json
          if git diff --cached --quiet; then
            echo 'NO_FORWARD_LEDGER_CHANGE'
          else
            git commit -m "R2.6 Forward OOS: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:btc-trend-v30-r26-final-integration
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-forward-oos-${{ github.run_id }}
          path: btc_trend_v30/r26/forward_oos/
          retention-days: 90
