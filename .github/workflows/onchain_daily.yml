name: MASTER Onchain Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '37 0 * * *'
  push:
    paths:
      - 'onchain/**'
      - '.github/workflows/onchain_daily.yml'

permissions:
  contents: write

concurrency:
  group: master-onchain-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: onchain/requirements.txt

      - name: Install dependencies
        run: pip install -r onchain/requirements.txt

      - name: Collect public BTC on-chain confirmation metrics
        run: python onchain/collector.py

      - name: Validate collection
        run: |
          python - <<'PY'
          import json, sys
          s=json.load(open('onchain/state/collector_state.json'))
          print(s)
          if s.get('status') != 'OK':
              sys.exit('No usable on-chain metrics')
          PY

      - name: Commit updated data
        run: |
          git config user.name "onchain-data-bot"
          git config user.email "onchain-data-bot@users.noreply.github.com"
          git add onchain/output onchain/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily BTC onchain snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
