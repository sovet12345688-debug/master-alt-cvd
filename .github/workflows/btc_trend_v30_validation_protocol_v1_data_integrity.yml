name: BTC TREND V3.0 Validation Protocol V1 Step1-10
# Research branch only. V2.6 production is read-only canonical context and is never modified.

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/validation_protocol_v1_data_integrity.py'
      - 'btc_trend_v30/validation_protocol_v1_step2_r12_daily_scoring.py'
      - 'btc_trend_v30/validation_protocol_v1_step3_episode_dedupe.py'
      - 'btc_trend_v30/validation_protocol_v1_step4_outcome_labels.py'
      - 'btc_trend_v30/validation_protocol_v1_step5_walk_forward_oos.py'
      - 'btc_trend_v30/validation_protocol_v1_step6_state_machine_replay.py'
      - 'btc_trend_v30/validation_protocol_v1_step6_runner.py'
      - 'btc_trend_v30/validation_protocol_v1_step7_metrics.py'
      - 'btc_trend_v30/validation_protocol_v1_step8_robustness.py'
      - 'btc_trend_v30/validation_protocol_v1_step8_runner.py'
      - 'btc_trend_v30/validation_protocol_v1_step9_exact_v26_h2h.py'
      - 'btc_trend_v30/validation_protocol_v1_step10_final_promotion.py'
      - '.github/workflows/btc_trend_v30_validation_protocol_v1_data_integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validation-step1-10:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Step1 - Data Integrity
        run: python btc_trend_v30/validation_protocol_v1_data_integrity.py
      - name: Step1 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/data_integrity/audit.json',encoding='utf-8'))
          print('STEP1=',d['data_integrity'],'ROWS=',d['final_rows'],'/',d['expected_rows'])
          if d['data_integrity']!='PASS': sys.exit('STOP: Step1 HOLD')
          PY

      - name: Step2 - R1.2 four-engine FULL DAILY ROLLING
        run: python btc_trend_v30/validation_protocol_v1_step2_r12_daily_scoring.py
      - name: Step2 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step2_full_daily_scoring/audit.json',encoding='utf-8'))
          print('STEP2=',d['step2'],'PIT=',d['point_in_time_prefix_invariance']['pass'])
          if d['step2']!='PASS': sys.exit('STOP: Step2 HOLD')
          PY

      - name: Step3 - Zone Family Independent Episode Dedupe
        run: python btc_trend_v30/validation_protocol_v1_step3_episode_dedupe.py
      - name: Step3 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step3_episode_dedupe/audit.json',encoding='utf-8'))
          print('STEP3=',d['step3'],'EPISODE_N=',d['independent_episode_n'])
          if d['step3']!='PASS': sys.exit('STOP: Step3 HOLD')
          PY

      - name: Step4 - Medium Long Outcome Labels
        run: python btc_trend_v30/validation_protocol_v1_step4_outcome_labels.py
      - name: Step4 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step4_outcome_labels/audit.json',encoding='utf-8'))
          print('STEP4=',d['step4'],'EPISODES=',d['episodes'])
          if d['step4']!='PASS': sys.exit('STOP: Step4 HOLD')
          PY

      - name: Step5 - Walk-Forward OOS WF1-WF6
        run: python btc_trend_v30/validation_protocol_v1_step5_walk_forward_oos.py
      - name: Step5 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step5_walk_forward_oos/audit.json',encoding='utf-8'))
          print('STEP5=',d['step5'],'OOS_EPISODES=',d['oos_episodes'])
          if d['step5']!='PASS': sys.exit('STOP: Step5 HOLD')
          PY

      - name: Step6 - 1H 4H 1D State Machine Replay
        run: python btc_trend_v30/validation_protocol_v1_step6_runner.py
      - name: Step6 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step6_state_machine_replay/audit.json',encoding='utf-8'))
          print('STEP6=',d['step6'],'EPISODES=',d['episode_counts'],'LEGS=',d['oos_raw_leg_metrics'])
          if d['step6']!='PASS': sys.exit('STOP: Step6 HOLD')
          PY

      - name: Step7 - Metrics MCR Expectancy False Start Missed Trend
        run: python btc_trend_v30/validation_protocol_v1_step7_metrics.py
      - name: Step7 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step7_metrics/audit.json',encoding='utf-8'))
          print('STEP7=',d['step7'],'RAW=',d['raw_all_leg'],'MCR=',d['mcr'])
          if d['step7']!='PASS': sys.exit('STOP: Step7 HOLD')
          PY

      - name: Step8 - LOCO Robustness Weight Threshold Zone ATR Cycle
        run: python btc_trend_v30/validation_protocol_v1_step8_runner.py
      - name: Step8 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step8_robustness/audit.json',encoding='utf-8'))
          print('STEP8=',d['step8'])
          print('ROBUSTNESS=',d['robustness_performance_gate'])
          print('NEIGHBORHOOD=',d['neighborhood'])
          print('LOCO=',d['loco'])
          print('CYCLE=',d['cycle'])
          print('MCR_GATE=',d['mcr_promotion_gate'])
          if d['step8']!='PASS': sys.exit('STOP: Step8 HOLD')
          PY

      - name: Step9 - Exact V2.6 Head-to-Head Audit
        run: python btc_trend_v30/validation_protocol_v1_step9_exact_v26_h2h.py
      - name: Step9 gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step9_exact_v26_h2h/audit.json',encoding='utf-8'))
          print('STEP9_AUDIT=',d['step9_audit'])
          print('EXACT_H2H_STATUS=',d['exact_h2h_status'])
          if d['step9_audit']!='PASS': sys.exit('STOP: Step9 canonical audit HOLD')
          PY

      - name: Step10 - Final Promotion PASS HOLD Decision
        run: python btc_trend_v30/validation_protocol_v1_step10_final_promotion.py
      - name: Step10 final gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('btc_trend_v30/output/validation_v1/step10_final_promotion/audit.json',encoding='utf-8'))
          print('STEP10_AUDIT=',d['step10_audit'])
          print('PROMOTION_DECISION=',d['promotion_decision'])
          print('HARD_FAILURES=',d['hard_failures'])
          print('UNRESOLVED_BLOCKERS=',d['unresolved_blockers'])
          print('REASON_CODES=',d['reason_codes'])
          if d['step10_audit']!='PASS': sys.exit('STOP: Step10 audit failed')
          if d['promotion_decision'] not in ('PASS','HOLD'): sys.exit('STOP: invalid final decision')
          PY

      - name: Upload Step1-10 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-validation-v1-step1-10
          path: btc_trend_v30/output/validation_v1/
          retention-days: 14
