name: MASTER MARKET Active Score Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '58 * * * *'
  pull_request:
    paths:
      - 'market_scoring/score_engine_contract.json'
      - 'market_scoring/score_engine_candidate_v1.json'
      - 'market_scoring/run_score_engine.py'
      - 'market_scoring/persist_official_score_history.py'
      - 'market_scoring/validate_score_engine.py'
      - 'market_vault/dxy_adapter.py'
      - 'market_vault/oil_adapter.py'
      - 'maintenance/apply_master_market_na_recovery_contract_patch.py'
      - 'state/master_market_score_history.csv'
      - '.github/workflows/master_market_score_engine_active.yml'
  push:
    branches:
      - main
    paths:
      - 'market_scoring/score_engine_contract.json'
      - 'market_scoring/score_engine_candidate_v1.json'
      - 'market_scoring/run_score_engine.py'
      - 'market_scoring/persist_official_score_history.py'
      - 'market_scoring/validate_score_engine.py'
      - 'market_vault/dxy_adapter.py'
      - 'market_vault/oil_adapter.py'
      - 'maintenance/apply_master_market_na_recovery_contract_patch.py'
      - '.github/workflows/master_market_score_engine_active.yml'

permissions:
  contents: write

concurrency:
  group: master-market-score-engine-active
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Validate migration patch syntax
        run: python -m py_compile maintenance/apply_master_market_na_recovery_contract_patch.py

      - name: Apply approved score-history and macro recovery contract patch
        run: python maintenance/apply_master_market_na_recovery_contract_patch.py

      - name: Validate canonical and contract split
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('master_prompts/master_market_v1_2_current.md').read_text(encoding='utf-8')
          c=json.load(open('state/master_market_v1_2_contract.json',encoding='utf-8'))
          assert 'SCORE HISTORY SEPARATION + DXY/OIL RECOVERY — APPROVED 2026-09-12' in p
          assert 'state/master_market_score_history.csv' in p
          assert 'state/master_market_official_history.csv' in p
          h=c['official_score_history']
          assert h['file']=='state/master_market_score_history.csv'
          assert h['final_official_state_separate'] is True
          assert h['legacy_final_decision_history']=='state/master_market_official_history.csv'
          assert 'dxy_adapter' in c['source_policy']
          assert 'oil_adapter' in c['source_policy']
          print('MASTER_MARKET_SCORE_HISTORY_SEPARATION=PASS')
          PY

      - name: Syntax
        run: |
          python -m py_compile \
            market_scoring/validate_score_engine.py \
            market_scoring/run_score_engine.py \
            market_scoring/persist_official_score_history.py \
            market_vault/oil_adapter.py \
            market_vault/dxy_adapter.py

      - name: Require approved ACTIVE engine
        run: python market_scoring/validate_score_engine.py --require-active

      - name: Refresh Oil and DXY same-source adapters
        run: |
          python market_vault/oil_adapter.py
          python market_vault/dxy_adapter.py

      - name: Validate Oil and DXY adapter contract
        run: |
          python - <<'PY'
          import json
          summary=json.load(open('market_vault/output/latest_summary.json',encoding='utf-8'))
          metrics={m.get('metric'):m for m in summary.get('metrics',[]) if isinstance(m,dict)}
          dxy=metrics.get('DXY') or {}
          assert dxy.get('source')=='Yahoo Finance:DX-Y.NYB', dxy
          for key in ('vs_24h','vs_3d','vs_7d'):
              assert dxy.get(key) is not None, ('DXY',key)
          wti=metrics.get('WTI') or {}
          brent=metrics.get('BRENT') or {}
          assert wti.get('source')=='Yahoo Finance:CL=F', wti
          assert brent.get('source')=='Yahoo Finance:BZ=F', brent
          for name,row in (('WTI',wti),('BRENT',brent)):
              for key in ('vs_24h','vs_3d','vs_7d'):
                  assert row.get(key) is not None, (name,key)
          print('MASTER_MARKET_MACRO_ADAPTERS=PASS')
          PY

      - name: Run production scorer
        run: python market_scoring/run_score_engine.py

      - name: Validate production output contract
        run: |
          python - <<'PY'
          import json
          p='market_scoring/output/latest_scores.json'
          x=json.load(open(p, encoding='utf-8'))
          assert x['engine']=='MASTER_MARKET_SCORE_ENGINE_V1'
          assert x['status'] in ['ACTIVE_OK','PARTIAL','BLOCKED_SCORE_NA','BLOCKED_STALE_INPUT']
          # Final OFFICIAL state/direction remains owned by the separate state bridge.
          assert x['official_history_write_enabled'] is False
          assert x['watch_history_write_enabled'] is False
          assert x['score_history_source']=='state/master_market_score_history.csv'
          assert x['anti_fallback']['last_known_score_reuse'] is False
          assert x['anti_fallback']['na_as_zero'] is False
          required=['liquidity_lead','crypto_money_inflow','alt_money_inflow','market_positive']
          assert list(x['scores']) == required
          for key in required:
              row=x['scores'][key]
              assert 0 <= row['coverage_pct'] <= 100
              if row['score'] is not None:
                  assert 0 <= row['score'] <= 100
              assert row['status'] in ['ACTIVE_OK','PARTIAL','N/A']
          # DXY and Oil must no longer be structural N/A after adapters pass.
          assert x['scores']['liquidity_lead']['components']['dxy'] is not None
          assert x['scores']['market_positive']['components']['oil_geopolitical_state'] is not None
          print('MASTER_MARKET_ACTIVE_SCORE_OUTPUT=PASS')
          PY

      - name: Validate OFFICIAL score-slot mapping
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from market_scoring.persist_official_score_history import target_official_slot
          # 11:58 UTC = 20:58 KST -> next 21:00 OFFICIAL score slot.
          t=target_official_slot(datetime(2026,9,12,11,58,tzinfo=timezone.utc))
          assert t is not None and t.hour == 21
          # A modest scheduler delay after the hour must still map to 21:00.
          t=target_official_slot(datetime(2026,9,12,12,7,tzinfo=timezone.utc))
          assert t is not None and t.hour == 21
          # WATCH precursor must never persist.
          assert target_official_slot(datetime(2026,9,12,10,58,tzinfo=timezone.utc)) is None
          # Mid-hour manual-like timing remains fail-closed.
          assert target_official_slot(datetime(2026,9,12,12,30,tzinfo=timezone.utc)) is None
          print('MASTER_MARKET_SCORE_HISTORY_SLOT_GUARD=PASS')
          PY

      - name: Activation PR must remove structural N/A
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('market_scoring/output/latest_scores.json', encoding='utf-8'))
          assert x['official_persistence_eligible'] is True, x
          assert x['status'] in ['ACTIVE_OK','PARTIAL'], x['status']
          missing=[k for k,v in x['scores'].items() if v['score'] is None]
          assert not missing, missing
          print('MASTER_MARKET_STRUCTURAL_NA_RECOVERY=PASS')
          print({k:v['score'] for k,v in x['scores'].items()})
          PY

      - name: Prove scorer does not directly mutate final OFFICIAL state
        run: |
          git diff --exit-code -- state/master_market_official_history.csv official_state/latest official_state/history || {
            echo 'SCORE ENGINE MUST NOT DIRECTLY MUTATE FINAL OFFICIAL STATE'; exit 1;
          }

      - name: Persist separate OFFICIAL score history
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: python market_scoring/persist_official_score_history.py

      - name: Restore Vault-owned summary before repository write
        run: git checkout -- market_vault/output/latest_summary.json

      - name: Commit score, adapters, history and approved contract patch on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "master-market-score-bot"
          git config user.email "master-market-score-bot@users.noreply.github.com"
          git add \
            market_scoring/run_score_engine.py \
            market_scoring/output/latest_scores.json \
            state/master_market_score_history.csv \
            master_prompts/master_market_v1_2_current.md \
            state/master_market_v1_2_contract.json \
            market_vault/output/latest_dxy.json \
            market_vault/output/latest_oil.json
          if git diff --cached --quiet; then
            echo "No score/adapter/history/contract change"
            exit 0
          fi
          git commit -m "score: refresh MASTER MARKET score history and macro adapters"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final result
        run: echo 'MASTER_MARKET_ACTIVE_SCORE_ENGINE=PASS'
