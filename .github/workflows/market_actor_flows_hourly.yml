name: MARKET Actor Flows Hourly

# recovery trigger: 2026-09-09 KST
on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
  push:
    paths:
      - 'market_vault/output_adapter.py'
      - 'market_vault/actor_freshness_guard.py'
      - '.github/workflows/market_actor_flows_hourly.yml'

permissions:
  contents: write

concurrency:
  group: market-actor-flows-hourly
  cancel-in-progress: true

jobs:
  refresh-actor-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build actor flow adapter
        run: |
          python -m py_compile market_vault/output_adapter.py
          python -m py_compile market_vault/actor_freshness_guard.py
          python market_vault/output_adapter.py
          python market_vault/actor_freshness_guard.py

      - name: Validate actor flow freshness and schema
        run: |
          python - <<'PY'
          import csv, json, sys
          from datetime import datetime, timezone

          MAX_AGE_MIN = 90.0

          with open('market_vault/output/latest_actor_flows.json', encoding='utf-8') as f:
              ac = json.load(f)
          if ac.get('engine') != 'MASTER_MARKET_ACTOR_FLOW_ADAPTER_V1':
              sys.exit('wrong actor adapter engine')
          if ac.get('score_weight') != 0:
              sys.exit('actor adapter score_weight must remain 0')
          if float(ac.get('retail_freshness_max_age_minutes', -1)) != MAX_AGE_MIN:
              sys.exit('actor retail freshness threshold mismatch')

          generated = datetime.fromisoformat(ac['generated_at_utc'].replace('Z','+00:00'))
          age_min = (datetime.now(timezone.utc) - generated).total_seconds()/60
          if age_min > 15:
              sys.exit(f'actor adapter output too old: {age_min:.1f}m')

          for coin in ('BTC','ETH'):
              wh = ac.get('whale',{}).get(coin,{})
              rp = ac.get('retail_proxy',{}).get(coin,{})
              if wh.get('current') is None:
                  sys.exit(f'{coin} current whale NET missing')
              if wh['current'].get('net_usd') is None:
                  sys.exit(f'{coin} whale net_usd missing')

              status = rp.get('current_status')
              if status not in ('OK','STALE_UPSTREAM','MISSING_UPSTREAM'):
                  sys.exit(f'{coin} invalid retail freshness status: {status}')
              if status == 'OK':
                  if rp.get('current') is None:
                      sys.exit(f'{coin} retail status OK but current missing')
                  source_age = rp.get('source_age_minutes')
                  if source_age is None or float(source_age) > MAX_AGE_MIN:
                      sys.exit(f'{coin} retail freshness violation age={source_age}')
              else:
                  if rp.get('current') is not None:
                      sys.exit(f'{coin} stale retail current must be N/A')
                  for key in ('1d','3d','7d'):
                      if rp.get(key) is not None:
                          sys.exit(f'{coin} stale retail comparison must be N/A: {key}')

              funding_status = rp.get('funding_status')
              if funding_status not in ('OK','STALE_UPSTREAM','MISSING_UPSTREAM'):
                  sys.exit(f'{coin} invalid funding freshness status: {funding_status}')
              if funding_status == 'OK':
                  f_age = rp.get('funding_age_minutes')
                  if rp.get('funding') is None or f_age is None or float(f_age) > MAX_AGE_MIN:
                      sys.exit(f'{coin} funding freshness violation age={f_age}')
              elif rp.get('funding') is not None:
                  sys.exit(f'{coin} stale funding must be N/A')

          # Ensure the actor current whale snapshot follows the latest stored whale history.
          with open('market_whales/data/positions_history.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          for coin in ('BTC','ETH'):
              times = [r.get('time_utc') for r in rows if r.get('coin') == coin and r.get('time_utc')]
              if not times:
                  sys.exit(f'{coin} whale history empty')
              latest = max(times)
              actor_time = ac['whale'][coin]['current'].get('snapshot_time_utc')
              if actor_time != latest:
                  sys.exit(f'{coin} actor whale snapshot stale: actor={actor_time} latest={latest}')

          print('MARKET_ACTOR_FLOW_REFRESH=PASS')
          print('MARKET_ACTOR_RETAIL_STATUS='+str(ac.get('retail_proxy_status')))
          PY

      - name: Commit actor adapter output
        run: |
          git config user.name "market-actor-flow-bot"
          git config user.email "market-actor-flow-bot@users.noreply.github.com"

          # output_adapter.py also regenerates stablecoin windows. This dedicated
          # workflow owns only actor-flow output, so leave stablecoin output to
          # the MARKET Data Vault workflow and keep the worktree clean for rebase.
          git restore -- market_vault/output/latest_stablecoin_windows.json
          git add market_vault/output/latest_actor_flows.json

          if git diff --cached --quiet; then
            echo "No actor-flow changes"
          else
            git commit -m "data: refresh MARKET actor flow adapter"
            for n in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              echo "push retry $n"
              sleep $((n*5))
            done
            exit 1
          fi
