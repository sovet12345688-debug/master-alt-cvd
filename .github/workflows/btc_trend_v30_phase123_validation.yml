name: BTC TREND V3.0 Phase1.1-1.3 Validation

on:
  push:
    branches: [btc-trend-v30-build]
    paths:
      - 'btc_trend_v30/run_phase1_123.py'
      - 'btc_trend_v30/run_phase1_origin_chart.py'
      - 'btc_trend_v30/run_phase1_origin_chart_v02.py'
      - '.github/workflows/btc_trend_v30_phase123_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  phase123-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run Phase 1.1 -> 1.2 -> 1.3 sequential validation
        run: python btc_trend_v30/run_phase1_123.py
      - name: Show compact verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='btc_trend_v30/output/phase123/phase123_summary.json'
          d=json.load(open(p,encoding='utf-8'))
          print('ENGINE=',d['engine'])
          print('DATA=',d['data'])
          print('PHASE11=',d['phase11'])
          print('PHASE12=',d['phase12'])
          print('PHASE13=',d['phase13'])
          print('MASTER_EFFECT=',d['master_effect'])
          print('MERGE=',d['merge'])
          PY
      - name: Upload Phase1.1-1.3 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-v30-phase123
          path: btc_trend_v30/output/phase123/
          retention-days: 14
